<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    padding:40px 0;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
}

.campanha{
    position:relative;
    width:900px;
    max-width:95%;
}

.campanha img{
    width:100%;
    display:block;
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

/* Botão sobreposto */
.cta{
    position:absolute;

    right:7.6%;
    bottom:7.1%;

    background:#7b2cff;
    color:#fff;
    text-decoration:none;

    border-radius:999px;

    font-weight:700;
    white-space:nowrap;

    padding:1.4% 3.5%;

    font-size:clamp(8px, 1.4vw, 15px);

    box-shadow:0 4px 12px rgba(123,44,255,.25);
}

@media (max-width: 768px) {
    .cta {
        right: 5.5%;
        bottom: 6.8%;
        font-size: 10px;
        padding: 8px 10px;
    }
}

.cta:hover{
    transform:translateY(-2px);
}
</style>
</head>
<body>

<div class="campanha">

    <img
        src="assets/promo.png"
        alt="Campanha Velvet">

    <a
        href="https://www.velvet.lat/"
        class="cta">
        VAMOS PRA CIMA →
    </a>

</div>

</body>
</html>
