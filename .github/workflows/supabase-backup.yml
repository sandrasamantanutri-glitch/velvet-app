name: Backup Diário do Banco

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar PostgreSQL 17 Client
        run: |
          sudo apt-get update
          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          pg_dump --version

      - name: Gerar nome do backup
        id: vars
        run: |
          echo "DATE=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Fazer dump do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump \
            --dbname="$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            --encoding=UTF8 \
            > backup_${{ steps.vars.outputs.DATE }}.sql

      - name: Compactar backup
        run: |
          gzip backup_${{ steps.vars.outputs.DATE }}.sql

      - name: Clonar repositório de backup
        env:
          TOKEN: ${{ secrets.BACKUP_VELVET }}
        run: |
          git clone https://sandrasamantanutri-glitch:${TOKEN}@github.com/sandrasamantanutri-glitch/velvet-db-backup.git

      - name: Copiar backup
        run: |
          cp backup_${{ steps.vars.outputs.DATE }}.sql.gz velvet-db-backup/

      - name: Manter apenas os últimos 90 backups
        run: |
          cd velvet-db-backup
          ls -1tr *.sql.gz 2>/dev/null | head -n -90 | xargs -r rm

      - name: Commit e Push
        env:
          TOKEN: ${{ secrets.BACKUP_VELVET }}
        run: |
          cd velvet-db-backup

          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Backup banco $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "Nenhuma alteração para enviar."
          fi