name: Mirror para Repositório de Backup

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    name: Espelhar código para backup privado
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout completo do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar repositório de backup
        run: |
          git remote remove backup || true
          git remote add backup https://sandrasamantanutri-glitch:${{ secrets.BACKUP_VELVET }}@github.com/sandrasamantanutri-glitch/velvet-app-backup.git

      - name: Enviar para o repositório de backup
        run: |
          git push --force backup main