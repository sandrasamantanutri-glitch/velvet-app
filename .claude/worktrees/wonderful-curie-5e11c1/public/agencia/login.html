<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Agências - Velvet</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  color:#fff;
}


.card{
  background:#c9c9c9a4;
  padding:40px;
  width:350px;
  border-radius:14px;
  box-shadow:#7B2CFF;
  align-items:center;
  justify-content:center;
}

h2{
  text-align:center;
  margin-bottom:30px;
  color:#7B2CFF;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:8px;
  background:#f1f1f1;
  color:#1E1E26;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#7B2CFF;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  width: 200px;
   display: block;
  margin: 0 auto;
}

button:hover{
  background:#9E6BFF;
}
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background:none;
  display: flex;
  align-items: center;
  padding-left: 20px;
  z-index: 1000;
}

.logo {
  height: 100px; /* controla tamanho */
  width: auto;
}

</style>
</head>

<body>

    <header class="header">
  <div class="header-container">
    <img src="/assets/velvet.png" alt="Velvet" class="logo"></div>
</header>

 <div class="titulo"><h2>Velvet - Agências</h2>

<div class="card">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>
 </div>

<script>
async function login(){
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch("/api/agencia/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({email,senha})
  });

  const data = await res.json();

  if(res.ok){
    localStorage.setItem("token_agencia", data.token);
    window.location.href="dashboard.html";
  }else{
    alert(data.error);
  }
}
</script>

</body>
</html>
