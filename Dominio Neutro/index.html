<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ff">
  <title>Velvet</title>
  <meta name="description" content="Vem me conhecer melhor, acesse meu perfil na Velvet!">
  <meta property="og:title" content="Velvet">
  <meta property="og:description" content="Acesse o perfil da sua influencer favorita na Velvet.">
  <meta property="og:type" content="profile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --velvet: #7B2CFF;
      --velvet-dark: #4210b8;
      --pink: #7B2CFF;
      --ink: #211447;
      --muted: #6d6487;
      --line: rgba(100, 24, 237, .14);
      --surface: rgba(255,255,255,.78);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: flex; align-items: center; justify-content: center;
      overflow-x: hidden; font-family: 'Poppins', sans-serif; color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 22%, rgba(192,151,255,.48), transparent 33%),
        radial-gradient(ellipse at 95% 78%, rgba(177, 126, 244, 0.34), transparent 32%),
        linear-gradient(135deg, #fbfaff 0%, #f0eaff 48%, #fff8fd 100%);
    }
    body::before { content:""; position:fixed; border-radius:50%; opacity:.18; pointer-events:none; width: 260px; height: 260px; top: -120px; right: -70px; background: linear-gradient(135deg,#7b2cff,#9158ed); }
    body::after  { content:""; position:fixed; border-radius:50%; opacity:.18; pointer-events:none; width: 220px; height: 220px; bottom: -125px; left: -85px; background: linear-gradient(135deg,#d6baff,#bf8cef); }
    .shell {
      position: relative; z-index: 1; width: min(100%, 510px); padding: 30px;
      border: 1px solid rgba(255,255,255,.9); border-radius: 30px;
      background: var(--surface); box-shadow: 0 24px 80px rgba(74,35,143,.15), inset 0 1px 0 #fff;
      backdrop-filter: blur(18px); text-align: center; animation: arrive .65s cubic-bezier(.2,.75,.25,1) both;
    }
    @keyframes arrive { from { opacity:0; transform: translateY(18px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
    .brand { display:flex; justify-content:center; align-items:center; margin: 0 auto 22px; }
    .brand img { display:block; width: 180px; max-width: 62%; height:auto; object-fit:contain; }
    .eyebrow { display:flex; align-items:center; justify-content:center; gap:11px; margin-bottom:22px; color:var(--velvet); font-size:11px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; }
    .eyebrow::before, .eyebrow::after { content:""; width:35px; height:1px; background:linear-gradient(90deg,transparent,#b99bff); }
    .eyebrow::after { transform:rotate(180deg); }
    .portrait-frame {
      position:relative; width:150px; height:150px; margin:0 auto 18px; padding:5px;
      border-radius:50%; background:linear-gradient(135deg,var(--velvet),#a33aff 48%,var(--pink));
      box-shadow: 0 12px 28px rgba(100,24,237,.22);
    }
    .portrait-frame::after {
      content:"♥"; position:absolute; right:-2px; bottom:3px; width:39px; height:39px;
      display:grid; place-items:center; border:3px solid #fff; border-radius:50%;
      color:white; font-size:19px; background:linear-gradient(135deg,var(--velvet),var(--pink));
      box-shadow:0 6px 16px rgba(100,24,237,.24);
    }
    .avatar { width:100%; height:100%; display:block; object-fit:cover; border:3px solid white; border-radius:50%; background:#eee5ff; }
    .avatar-fallback { display:none; width:100%; height:100%; align-items:center; justify-content:center; border:3px solid white; border-radius:50%; color:white; font-size:44px; font-weight:700; background:linear-gradient(135deg,#6a20ed,#ec55c2); }
    .name { margin:0; font-size:clamp(27px,6vw,36px); line-height:1.15; font-weight:800; letter-spacing:-.04em; overflow-wrap:anywhere; }
    .verified { display:inline-grid; vertical-align:middle; place-items:center; width:20px; height:20px; margin-left:5px; border-radius:50%; color:white; font-size:12px; background:var(--velvet); box-shadow:0 3px 8px #6418ed33; }
    .subtitle { margin:10px 0 0; color:var(--velvet); font-size:10px; font-weight:700; letter-spacing:.25em; text-transform:uppercase; }
    .bio { max-width:380px; margin:18px auto 0; color:#51466e; font-size:14px; line-height:1.75; overflow-wrap:anywhere; }
    .location { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:7px 12px; border:1px solid var(--line); border-radius:99px; color:var(--muted); background:#fff9; font-size:11px; }
    .features { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:27px 0 25px; }
    .feature { min-width:0; padding:14px 5px 12px; border:1px solid rgba(115,65,213,.12); border-radius:18px; background:linear-gradient(150deg,#fff,#f8f2ff); }
    .feature-icon { display:grid; place-items:center; width:48px; height:48px; margin:0 auto 9px; border-radius:16px; color:var(--velvet); background:linear-gradient(135deg,#eee2ff,#f9ddf4); box-shadow:inset 0 1px 0 white; }
    .feature-icon svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .feature-label { color:#43365f; font-size:11px; line-height:1.4; font-weight:600; }
    .access-panel { padding:20px; border:1px solid rgba(129,82,216,.2); border-radius:22px; background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(247,239,255,.88)); box-shadow:0 8px 24px rgba(89,45,157,.07); }
    .access-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; text-align:left; }
    .access-title { font-size:14px; font-weight:700; }
    .count { flex-shrink:0; color:var(--velvet); font-size:12px; font-weight:600; }
    .progress-track { height:8px; overflow:hidden; border-radius:99px; background:#e7def7; box-shadow:inset 0 1px 2px #4b237015; }
    .progress-bar { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--velvet),#a72df0,var(--pink)); box-shadow:0 0 12px #b64be966; transition:width .08s linear; }
    .redirect-note { display:flex; justify-content:center; align-items:center; gap:8px; margin:13px 0 18px; color:#71638d; font-size:11px; line-height:1.5; }
    .bolt { color:var(--velvet); font-size:17px; }
    .cta { display:flex; justify-content:center; align-items:center; gap:13px; width:100%; min-height:58px; padding:15px 20px; border:0; border-radius:99px; color:#fff; text-decoration:none; font:700 15px 'Poppins',sans-serif; background:linear-gradient(100deg,#6418ed 0%,#9529ed 52%,#9f4fe9 100%); box-shadow:0 10px 22px rgba(112,31,220,.24),inset 0 1px 0 #ffffff70; transition:transform .2s,box-shadow .2s; }
    .cta:hover { transform:translateY(-2px); box-shadow:0 14px 27px rgba(112,31,220,.3); }
    .cta:focus-visible { outline:3px solid #a98aff; outline-offset:4px; }
    .cta-arrow { font-size:22px; font-weight:400; }
    .trust { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:23px 0 20px; }
    .trust-item { display:flex; justify-content:center; align-items:center; gap:7px; color:#625778; font-size:10px; line-height:1.4; text-align:left; }
    .trust-item svg { flex-shrink:0; width:21px; height:21px; color:var(--velvet); stroke:currentColor; fill:none; stroke-width:1.8; }
    .footer { padding-top:16px; border-top:1px solid var(--line); }
    .footer img { width:112px; max-width:45%; height:auto; }
    .tagline { margin-top:4px; color:#897da2; font-size:9px; font-weight:600; letter-spacing:.3em; }
    .loading-state { padding:40px 0; color:var(--muted); font-size:14px; }
    @media (max-width:480px) {
      body { padding:14px 10px; align-items:flex-start; }
      .shell { margin:auto 0; padding:25px 17px 19px; border-radius:25px; }
      .portrait-frame { width:132px; height:132px; }
      .features { gap:6px; margin:22px 0; }
      .feature { border-radius:15px; }
      .feature-label { font-size:10px; }
      .access-panel { padding:16px 13px; }
      .access-heading { align-items:flex-start; flex-direction:column; gap:3px; }
      .trust { gap:5px; }
      .trust-item { gap:4px; font-size:9px; }
      .trust-item svg { width:18px; height:18px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>

        <div class="trust">
          <div class="trust-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg><span>Ambiente<br>seguro</span></div>
          <div class="trust-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="10" width="18" height="11" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg><span>Privacidade<br>e respeito</span></div>
          <div class="trust-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 8h5a2 2 0 0 1 0 4H9h4a2 2 0 0 1 0 4H8M11 6v12"/></svg><span>Benefícios<br>especiais</span></div>
        </div>`;
    }

    function footerHTML(tagline) {
      return `
        <footer class="footer">
          <img src="${LOGO_URL}" alt="Velvet" width="112" height="34" onerror="this.style.display='none'">
          <div class="tagline">${tagline}</div>
        </footer>`;
    }

    function accessPanelHTML(nomeLabel, destino, notaTexto, btnTexto) {
      return `
        <section class="access-panel" aria-label="Acesso ao perfil">
          <div class="access-heading">
            <div class="access-title">Seu momento favorito começa aqui</div>
            <div class="count">Entrando em <span id="count">${REDIRECT_SECS}</span>s</div>
          </div>
          <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
          <div class="redirect-note"><span class="bolt" aria-hidden="true">✦</span><span>${notaTexto}</span></div>
          <a class="cta" href="${destino}" id="btn">${btnTexto} <span class="cta-arrow" aria-hidden="true">→</span></a>
        </section>`;
    }

    async function init() {
      const card = document.getElementById("card");

      if (!modeloId) {
        card.innerHTML = brandHTML() + `
          <div class="eyebrow">Velvet</div>
          <h1 class="name">Link inválido</h1>
          <p class="bio">Nenhum perfil foi especificado neste link.</p>`;
        return;
      }

      try {
        const res = await fetch(API_BASE + "/api/modelo/publico/" + encodeURIComponent(modeloId));
        if (!res.ok) throw new Error("not found");
        const m = await res.json();
        renderPerfil(m);
      } catch (err) {
        renderFallback();
      }
    }

    function renderPerfil(m) {
      const card = document.getElementById("card");
      const nome = m.nome_exibicao || m.nome || "Criadora";
      const bio = m.bio || "Descubra mais sobre mim e conheça meu perfil na Velvet.";
      const avatar = m.avatar || (API_BASE + "/assets/avatar.png");
      const local = [m.cidade, m.estado].filter(Boolean).join(" • ");
      const destino = montarDestino();
      const inicialNome = nome.trim().charAt(0).toUpperCase() || "V";

      card.innerHTML = brandHTML() + `
        <div class="eyebrow">Vem me conhecer melhor 💜</div>
        <div class="portrait-frame">
          <img class="avatar" src="${esc(avatar)}" alt="Foto de perfil de ${esc(nome)}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="avatar-fallback" aria-hidden="true">${esc(inicialNome)}</div>
        </div>
        <h1 class="name">${esc(nome)}<span class="verified" aria-label="Perfil verificado">✓</span></h1>
        <div class="subtitle">Influencer na Velvet</div>
        <p class="bio">${esc(bio)}</p>
        ${local ? '<div class="location"><span aria-hidden="true">⌖</span>' + esc(local) + '</div>' : ""}
      ` + featuresHTML() + accessPanelHTML(
        nome,
        destino,
        "Você será direcionado ao perfil de <strong>" + esc(nome) + "</strong>.",
        "Entrar no perfil"
      ) + trustHTML() + footerHTML("APROVEITE SEUS MELHORES MOMENTOS");

      iniciarContagem(destino);
    }

    function renderFallback() {
      const card = document.getElementById("card");
      const destino = montarDestino();
      const nomeParam = params.get("nome");
      const avatarParam = params.get("avatar");
      const bioParam = params.get("bio");
      const nome = nomeParam || "Conheça esta criadora";
      const bio = bioParam || "Estamos preparando seu acesso. Entre no perfil para conhecer a criadora e descobrir os conteúdos disponíveis.";
      const avatar = avatarParam || "";
      const inicialNome = nome.trim().charAt(0).toUpperCase() || "V";

      card.innerHTML = brandHTML() + `
        <div class="eyebrow">Vem</div>
        <div class="portrait-frame">
          ${avatar ? '<img class="avatar" src="' + esc(avatar) + '" alt="Foto de perfil" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : ""}
          <div class="avatar-fallback" style="display:${avatar ? "none" : "flex"}" aria-hidden="true">${esc(inicialNome)}</div>
        </div>
        <h1 class="name">${esc(nome)}</h1>
        <div class="subtitle">Meu perfil na Velvet</div>
        <p class="bio">${esc(bio)}</p>
      ` + featuresHTML() + accessPanelHTML(
        nome,
        destino,
        "Os detalhes não carregaram neste momento. Você pode continuar para o perfil.",
        "Acessar perfil"
      ) + trustHTML() + footerHTML("MAIS PROXIMIDADE COM SEU INFLUENCER FAVORITO.");

      iniciarContagem(destino);
    }

    function iniciarContagem(destino) {
      const total = REDIRECT_SECS * 1000;
      const start = Date.now();
      const iv = setInterval(() => {
        const elapsed = Date.now() - start;
        const pct = Math.min((elapsed / total) * 100, 100);
        const bar = document.getElementById("bar");
        const count = document.getElementById("count");
        if (bar) bar.style.width = pct + "%";
        if (count) count.textContent = Math.max(0, Math.ceil((total - elapsed) / 1000));
        if (elapsed >= total) {
          clearInterval(iv);
          window.location.href = destino;
        }
      }, 50);
    }

    init();
  </script>
</body>
</html>
