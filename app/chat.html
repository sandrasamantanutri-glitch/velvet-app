<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./css/chat.css" />
  <link rel="stylesheet" href="/chatmodelo.css">
</head>

<body class="chat-app">

<header class="chat-header">
  <button class="btn-back" onclick="history.back()">‹</button>
  <div class="chat-title" id="chatTitle">Chat</div>
</header>

<main id="chatBox" class="chat-box"></main>

<footer class="chat-input">
 <button id="btnEnviarConteudo" onclick="abrirPopupConteudos()">
  Enviar conteúdo
</button>

  <input
    id="msgInput"
    type="text"
    placeholder="Digite uma mensagem…"
    autocomplete="off"
  />

  <button class="btn-enviar" onclick="enviarMensagem()">➤</button>
</footer>

<!-- POPUP DE CONTEÚDOS -->
<div id="popupConteudos" class="hidden">

  <div class="popup-box">
    <h3>Enviar conteúdo</h3>

    <div class="preview-scroll">
      <div id="previewConteudos" class="preview-grid"></div>
    </div>

    <div class="popup-preco">
      <label>Preço (R$)</label>
      <input type="number" id="precoConteudo" value="0" min="0" />
    </div>

    <div class="popup-actions">
      <button class="btn-cancelar" onclick="fecharPopupConteudos()">Cancelar</button>
      <button class="btn-enviar" onclick="confirmarEnvioConteudo()">Enviar</button>
    </div>
  </div>

</div>


<script src="/socket.io/socket.io.js"></script>
<script src="./js/chat.js"></script>
</body>
</html>
