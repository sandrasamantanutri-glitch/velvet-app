<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./css/chat.css" />
</head>

<body class="chat-app">

<header class="chat-header">
  <button class="btn-back" onclick="history.back()">‹</button>
  <div class="chat-title" id="chatTitle">Chat</div>
</header>

<main id="chatBox" class="chat-box"></main>

<footer class="chat-input">
  <button class="btn-conteudo" onclick="abrirPopupConteudos()">💜</button>

  <input
    id="msgInput"
    type="text"
    placeholder="Digite uma mensagem…"
    autocomplete="off"
  />

  <button class="btn-enviar" onclick="enviarMensagem()">➤</button>
</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="./js/chat.js"></script>
</body>
</html>
