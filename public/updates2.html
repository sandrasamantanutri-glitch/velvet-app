<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Velvet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/updates2.css">
  <script src="/i18n.js"></script>
</head>

<body>

<div id="header-container"></div>

<!-- Banner capa (fora do container para ser full-width) -->
<div class="updates-banner">
  <img id="bannerCapa" class="banner-capa" src="/assets/capapt.png" alt="">
</div>

<div class="container">

  <!-- Criadoras com novidades -->
  <div class="criadoras-section" id="criadorasSection" style="display:none">
    <div class="criadoras-header">
      <span class="criadoras-titulo" id="criadorasTitulo">⚡ Criadoras com novidades</span>
      <a href="/feed.html" class="criadoras-ver-todas">Ver todas →</a>
    </div>
    <div class="criadoras-scroll" id="criadorasScroll"></div>
  </div>

  <!-- Filtros -->
  <div class="filtros-wrap">
    <div class="filtro-tabs" id="filtroTabs">
      <button class="filtro-tab active" data-filtro="todos">Todas</button>
      <button class="filtro-tab" data-filtro="oferta">Ofertas</button>
      <button class="filtro-tab" data-filtro="fotos">Fotos e vídeos</button>
      <button class="filtro-tab" data-filtro="chat">Chat</button>
      <button class="filtro-tab" data-filtro="assinatura">Assinatura</button>
      <button class="filtro-tab" data-filtro="mencoes">Menções</button>
    </div>
    <button class="filtro-sort">Mais recentes ▾</button>
  </div>

  <!-- Lista de updates -->
  <div id="listaUpdates"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/header.js"></script>
<script src="/js/updates2.js"></script>

</body>
</html>
