<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
   <title>Perfil </title>
  <link rel="stylesheet" href="/ofertas.css">

</head>
<body>

<header class="app-header">
  <div class="header-inner">
   <img src="/assets/velvet.png" alt="Velvet" class="velvet-logo">
   <a href="/feed.html" title="Feed"><img src="/assets/feed.png" alt="Feed"></a>
   <a href="/perfil.html" title="Perfil"><img src="/assets/perfil.png" alt="Perfil"></a>
   <button id="btnMensagem"><img src="assets/chat.png" alt="Chat"><span id="badgeUnread" class="badge-unread hidden">0</span></button>
  </div>

</header>

<main>

<div class="ofertas-page">

  <!-- HEADER -->
  <div class="ofertas-header">
    <h2>Ofertas</h2>
    <button class="btn-criar" id="btnCriarOferta">+ Criar oferta</button>
  </div>

  <!-- TABS -->
  <div class="ofertas-tabs">
    <button class="tab active" data-tab="ativas">Ofertas ativas</button>
    <button class="tab" data-tab="inativas">Ofertas inativas</button>
  </div>

  <!-- LISTA DE OFERTAS -->
  <div class="ofertas-lista" id="listaOfertas">
    <!-- cards via JS -->
  </div>

</div>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/ofertas.js" defer></script>
</body>
</html>
