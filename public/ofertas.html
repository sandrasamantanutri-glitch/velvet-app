<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
   <title>Perfil </title>
  <link rel="stylesheet" href="/ofertas.css">

</head>
<body>

<header class="app-header">
  <div class="header-inner">
   <img src="/assets/velvet.png" alt="Velvet" class="velvet-logo">
   <a href="/feed.html" title="Feed"><img src="/assets/feed.png" alt="Feed"></a>
   <a href="/perfil.html" title="Perfil"><img src="/assets/perfil.png" alt="Perfil"></a>
   <button id="btnMensagem"><img src="assets/chat.png" alt="Chat"><span id="badgeUnread" class="badge-unread hidden">0</span></button>
  </div>

</header>

<main>
<div class="ofertas-container">

  <!-- HEADER -->
  <div class="ofertas-topo">
    <button class="btn-voltar">←</button>
    <h2>Ofertas</h2>
  </div>

  <!-- TABS -->
  <div class="ofertas-tabs">
    <button class="tab active" data-tab="ativas">Ativas</button>
    <button class="tab" data-tab="inativas">Inativas</button>
  </div>

  <div class="ofertas-criar">
  <button class="btn-criar-oferta" id="btnCriarOferta">
    + Criar oferta
  </button>
</div>

  <!-- LISTA -->
  <div class="ofertas-lista" id="ofertasLista"></div>

</div>

<div class="form-group">
  <label for="assinaturaMensal">
    Assinatura mensal <span style="color:red">*</span>
  </label>

  <div class="input-preco">
    <span class="moeda">R$</span>
    <input 
      type="number"
      id="assinaturaMensal"
      min="20"
      step="0.01"
      placeholder="20.00"
      required
    >
  </div>

  <small class="info-preco">
    Valor mínimo permitido: R$ 20,00
  </small>
</div>

<div class="form-group">
  <label for="descontoTrimestral">Desconto trimestral (%)</label>
  <input type="number" id="descontoTrimestral" min="0" max="50" step="1" value="0">
</div>

<div class="form-group">
  <label>Assinatura trimestral</label>
  <div class="input-preco">
    <span class="moeda">R$</span>
    <input type="text" id="assinaturaTrimestral" readonly>
  </div>
</div>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/ofertas.js" defer></script>
</body>
</html>
