<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Conteúdos Privados</title>
  <link rel="stylesheet" href="/ofertas.css">

</head>
<body>
 <div id="header-container"></div>

    <section class="area-card">

<main class="page-container">
       <button type="button" class="btn-voltar" onclick="history.back()">
      <img src="/assets/voltar.png" alt="Voltar">
     </button>
     
  <!-- HEADER -->
  <div class="ofertas-topo">
  <div class="plano-card">
      <h2>Assinaturas e Ofertas</h2>
  </div>
  <div class="plano-header">
    <h2>💎 Plano de Assinatura</h2>
    <span class="plano-badge">VIP</span>

  <div class="plano-grid">
    <div class="plano-item">
    <label>Escolha o valor mensal da sua assinatura</label><br>
      <label>Valor Mensal</label>
      <div class="input-preco">
        <span>R$</span>
        <input type="number" id="assinaturaMensal" min="20" step="0.01">
      </div>
    </div>

    <div class="plano-item">
      <label>Desconto Trimestral (%)</label>
      <div class="input-preco">
      <input type="number" id="descontoTrimestral" min="0" max="30">
      </div>
    </div>

    <div class="plano-item">
      <label>Valor Trimestral Final</label>
      <div class="input-preco">
        <span>R$</span>
        <input type="text" id="assinaturaTrimestral" readonly>
      </div>
    </div>
  </div>

  <button id="salvarPlanos" class="btn-plano-salvar">
    Salvar Plano
  </button>
</div>
</div>

<div class="ofertas-container">

  <!-- TABS -->
  <div class="ofertas-tabs">
    <button class="tab active" data-tab="ativas">Ativas</button>
    <button class="tab" data-tab="inativas">Inativas</button>
  </div>

  <div class="ofertas-criar">
  <button class="btn-criar-oferta" id="btnCriarOferta">
    + Criar oferta
  </button>
</div>

  <!-- LISTA -->
  <div class="ofertas-lista" id="ofertasLista"></div>

</div>

</main>

 <hr class="separator">

  <footer class="footer">
   <div class="footer-links">
      <a href="/terms.html" target="_blank" rel="noopener noreferrer">Termos de Uso</a>
     <a href="/privacy.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a>
      <a href="/policies.html">Política de Utilização</a>
    </div>
   <div class="footer-copy"> © 2026 Velvet. Todos os direitos reservados.</div>
  </footer>


    <script>
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("token");

  if (!token) {
    alert("Para ter acesso a essa página deve fazer seu login ou seu cadastro.");

    window.location.href = "/index.html";
    return;
  }

});
</script>

<script src="/socket.io/socket.io.js"></script>
<script src="/header.js" defer></script>
<script src="/ofertas.js" defer></script>
</body>
</html>
