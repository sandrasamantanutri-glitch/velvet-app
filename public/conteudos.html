<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
   <title>Conteúdos Privados</title>
   <link rel="stylesheet" href="/conteudos.css">
  <link rel="stylesheet" href="/area.css">
</head>

<body>
  <div id="header-container"></div>

    <section class="area-card">
     <button type="button" class="btn-voltar" onclick="history.back()">
      <img src="/assets/voltar.png" alt="Voltar">
     </button>

    <h1>Meus conteúdos à venda</h1>
    <button id="btnNovoConteudo" class="btn-principal">
      + Novo conteúdo
    </button>


    <div id="conteudosGrid" class="grid-conteudos">
      <!-- cards entram aqui -->
    </div>

    <div id="conteudosVazio" class="estado-vazio hidden">
      <p>Você ainda não tem conteúdos à venda.</p>
    </div>

  </section>

  <div id="modalNovoConteudo" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-box">
    <h2>Novo conteúdo</h2>

    <input type="file" id="fileConteudo" />
    
    <select id="tipoConteudo">
      <option value="imagem">Imagem</option>
      <option value="video">Vídeo</option>
    </select>

    <button id="btnEnviarConteudo" class="btn-principal">
      Enviar
    </button>

    <button id="btnFecharModal">Cancelar</button>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/conteudos.js"></script>

</body>
</html>
