<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Conteúdos Privados</title>
   <link rel="stylesheet" href="/conteudos.css">
  <link rel="stylesheet" href="/area.css">
</head>

<body>
  <div id="header-container"></div>

    <section class="area-card">
     <button type="button" class="btn-voltar" onclick="history.back()">
      <img src="/assets/voltar.png" alt="Voltar">
     </button>

<div class="titulo-area">
  <h3>Meus Exclusivos</h3>
</div>
    <button id="btnNovoConteudo" class="btn-principal">
      Adicionar nova mídia
    </button>


    <div id="conteudosGrid" class="grid-conteudos">
      <!-- cards entram aqui -->
    </div>

    <div id="conteudosVazio" class="estado-vazio hidden">
      <p>Você ainda não tem conteúdos à venda.</p>
    </div>

  </section>

  <div id="modalNovoConteudo" class="modal-conteudo">
  <div class="modal-conteudo"></div>

  <div class="modal-conteudo">
    <h2>Novo conteúdo</h2>
    <div class="file-upload">
<input type="file" id="fileConteudo" multiple accept="image/*,video/*" hidden>
  <label for="fileConteudo" class="btn-file">📁 Escolher mídia</label></div>
    <div class="file-upload"> <span id="fileName">Nenhuma mídia selecionada</span>
    </div>
    <button id="btnEnviarConteudo" class="btn-principal">Enviar
    </button>
    <div id="uploadProgressContainer" class="hidden">
  <div class="progress-bar">
    <div id="uploadProgressBar"></div>
  </div>
  <span id="uploadPercent">0%</span>
</div>

    <button id="btnFecharModal">Cancelar</button>
  </div>
  </div>

<div id="modalVisualizarConteudo" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-box modal-viewer">
    <button class="modal-close" id="btnFecharViewer">×</button>

    <div id="viewerConteudo"></div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/conteudos.js"></script>

</body>
</html>
