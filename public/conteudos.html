<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
   <title>Conteúdos Privados</title>
   <link rel="stylesheet" href="/conteudos.css">
  <link rel="stylesheet" href="/area.css">
</head>

<body>
 <div id="header-container"></div>

 <section class="area-card">
     <button type="button" class="btn-voltar" onclick="history.back()">
      <img src="/assets/voltar.png" alt="Voltar">
     </button>

      <h3>Meus Conteúdos Privados</h3>
      <p class="section-desc"> Gerencie seus conteúdos exclusivos. Este conteúdo só é acessível quando enviado via chat.</p>

      <div class="upload-box">
        <input type="file" id="conteudoFile" accept="image/*,video/*" hidden/>
        <label for="conteudoFile" class="btn-file">Escolher midia</label>
        <span id="fileName" class="file-name">Nenhuma midia selecionada</span>
        <button class="btn-primary" onclick="uploadConteudo()">Enviar Conteúdo</button>
      </div>

      <hr class="separator" />

      <h2 class="section-subtitle">Meus Conteúdos</h2>
      <div id="listaConteudos"></div>

    </section>
 
   <div id="modalMidia" class="modalMidia hidden">
    <span id="fecharModal" class="modalClose">&times;</span>
    <div class="modalContentWrapper">
      <img id="modalImg" class="modalMidiaContent" style="display:none;"/>
      <video id="modalVideo" class="modalMidiaContent" controls style="display:none;"></video>
    </div>
   </div>


  </section>

  
<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/conteudos.js"></script>

</body>
</html>
