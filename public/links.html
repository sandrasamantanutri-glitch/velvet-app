<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Links do meu Perfil</title>

  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/links.css">

  <script src="/i18n.js"></script>
</head>

<body>
 <div id="header-container"></div>

 <section class="area-card">
   <button type="button" class="btn-voltar" onclick="history.back()" data-i18n-title="links.voltar">
     <img src="/assets/voltar.png" alt="Voltar" data-i18n-alt="links.voltar">
   </button>

   <h2 data-i18n="links.titulo">Links do meu perfil</h2>

   <p class="sub" data-i18n="links.sub">
     Use estes links para divulgar seu perfil. Eles são gerados automaticamente para você.
   </p>

   <label data-i18n="links.instagram">Instagram</label>

   <div class="copy-field">
     <input type="text" id="linkInstagram" readonly />
     <button type="button" onclick="copiarLink('linkInstagram')" data-i18n="links.copiar">Copiar</button>
   </div>

   <label data-i18n="links.tiktok">TikTok</label>

   <div class="copy-field">
     <input type="text" id="linkTiktok" readonly />
     <button type="button" onclick="copiarLink('linkTiktok')" data-i18n="links.copiar">Copiar</button>
   </div>

   <label data-i18n="links.link_direto">Link de Acesso Direto</label>

   <div class="copy-field">
     <input type="text" id="linkDireto" readonly />
     <button type="button" onclick="copiarLink('linkDireto')" data-i18n="links.copiar">Copiar</button>
   </div>

 </section>

 <footer class="footer">
   <div class="footer-links">
     <a href="/terms.html" target="_blank" rel="noopener noreferrer" data-i18n="footer.termos">Termos de Uso</a>
     <a href="/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="footer.privacidade">Política de Privacidade</a>
     <a href="/policies.html" data-i18n="footer.politicas">Política de Utilização</a>
   </div>

   <div class="footer-copy" data-i18n="footer.copy">
     © 2026 Velvet. Todos os direitos reservados.
   </div>
 </footer>

 <script>
document.addEventListener("DOMContentLoaded", () => {
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "/index.html";
  }
});
</script>

<script src="/socket.io/socket.io.js"></script>
<script src="/header.js" defer></script>
<script src="/areaUsuario.js"></script>

</body>
</html>
