<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin - Validar Perfis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-left">
    <img src="/assets/velvet.png" class="logo-small">
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/modelos.html">Modelos</a>
      <a href="/admin/validar.html" class="active">Validar Perfis</a>
    </nav>
  </div>

  <div class="topbar-right filtros">
<div class="filtro-status">
  <button class="filtro-btn active" onclick="trocarStatus('em_analise', this)">Pendentes</button>
  <button class="filtro-btn" onclick="trocarStatus('aprovado', this)">Aprovados</button>
  <button class="filtro-btn" onclick="trocarStatus('rejeitado', this)">Rejeitados</button>
<button class="logout-btn" onclick="logoutAdmin()">Sair</button>
  </div>
</header>

<div class="main clean">
  <h1>Perfis</h1>

  <div id="listaPerfis"></div>
</div>

<script>
const token = localStorage.getItem("token_admin");

if (!token) {
  window.location.href = "/admin/login.html";
  throw new Error("Sem token admin");
}

let listaAgencias = [];
let statusAtual = "em_analise";
let paginaAtual = 1;

function logoutAdmin(){
  localStorage.removeItem("token_admin");
  window.location.href = "/admin/login.html";
}

async function carregarPerfis(){

const res = await fetch(
  `/api/admin/perfis?status=${statusAtual}&page=${paginaAtual}`,
  { headers:{ Authorization:"Bearer "+token } }
); 

  if(res.status === 401 || res.status === 403){
    localStorage.removeItem("token_admin");
    window.location.href="/admin/login.html";
    return;
  }

  if(!res.ok){
    alert("Erro ao carregar perfis");
    return;
  }

 const resposta = await res.json();
 const perfis = resposta.dados;      // ← AQUI
  const totalPages = resposta.totalPages;
  const page = resposta.page;

  const container = document.getElementById("listaPerfis");

  if(!perfis.length){
    container.innerHTML = "<p>Nenhum perfil pendente.</p>";
    return;
  }

  container.innerHTML = perfis.map(p=>`
    <div class="card validar-card">

        <div class="validar-topo">
  <div class="titulo-badge">
    <h3>${p.nome_exibicao}</h3>

    <span class="badge-tipo ${p.tipo}">
      ${p.tipo === "cliente" ? "Cliente → Modelo" : "Modelo"}
    </span>
  </div>

        <span class="badge ${p.dados_completos && p.documentos_completos ? 'ok':'pendente'}">
          ${p.dados_completos && p.documentos_completos ? 'Pronto para validar' : 'Incompleto'}
        </span>
      </div>

      <div class="validar-grid">

        <div class="validar-docs">

  ${p.doc_frente_url ? `
    <div class="doc-item">
      <span>Documento Frente</span>
      <a href="${p.doc_frente_url}" target="_blank">
        <img src="${p.doc_frente_url}" alt="Doc Frente">
      </a>
    </div>
  ` : ""}

  ${p.doc_verso_url ? `
    <div class="doc-item">
      <span>Documento Verso</span>
      <a href="${p.doc_verso_url}" target="_blank">
        <img src="${p.doc_verso_url}" alt="Doc Verso">
      </a>
    </div>
  ` : ""}

  ${p.selfie_url ? `
    <div class="doc-item">
      <span>Selfie</span>
      <a href="${p.selfie_url}" target="_blank">
        <img src="${p.selfie_url}" alt="Selfie">
      </a>
    </div>
  ` : ""}

</div>

        <div class="validar-config">
<div class="dados-perfil">

  ${(() => {

    function campo(label, valor, nomeCampo){
      return `
        <div class="campo-editavel">
          <label>${label}</label>
          <input 
            type="text" 
            id="edit_${nomeCampo}_${p.id}" 
            value="${valor || ""}" 
            placeholder="Não preenchido"
          >
        </div>
      `;
    }

    return `
      ${campo("Nome completo", p.nome_completo, "nome_completo")}
      ${campo("Data nascimento", p.data_nascimento, "data_nascimento")}
      ${campo("CPF", p.cpf, "cpf")}
      ${campo("Telefone", p.telefone || p.cliente_telefone, "telefone")}
      ${campo("Endereço", p.endereco || p.cliente_endereco, "endereco")}
      ${campo("País", p.pais, "pais")}
      ${campo("Estado", p.estado, "estado")}
      ${campo("Cidade", p.cidade, "cidade")}
      ${campo("Bio", p.bio, "bio")}
      ${campo("VIP Preço", p.vip_preco, "vip_preco")}
      ${campo("Instagram", p.instagram, "instagram")}
      ${campo("TikTok", p.tiktok, "tiktok")}
      ${campo("Email", p.email, "email")}

      <button 
        class="btn-salvar-dados"
        onclick="salvarDadosPerfil(${p.id}, '${p.tipo}')"
      >
        Salvar Dados
      </button>
    `;

  })()}

</div>

  <hr>
          <label>Agência</label>
          <select id="agencia_${p.id}">
  <option value="">Sem agência</option>
  ${
    listaAgencias.map(a=>
      `<option value="${a.id}">${a.nome}</option>`
    ).join("")
  }
</select>

          <label>Motivo (se rejeitar)</label>
          <textarea id="motivo_${p.id}" placeholder="Motivo da rejeição"></textarea>

          <div class="validar-botoes">

  <button 
    onclick="validar(${p.id}, '${p.tipo}', 'aprovado')" 
    class="btn-aprovar ${p.tipo}"
  >
    ${p.tipo === "cliente" ? "Promover para Modelo" : "Validar Modelo"}
  </button>

  <button 
    onclick="validar(${p.id}, '${p.tipo}', 'rejeitado')" 
    class="btn-rejeitar"
  >
    Rejeitar
  </button>

</div>

        </div>

      </div>

    </div>
  `).join("");

renderPaginacao(totalPages, page);
}

async function validar(id, tipo, status){

  const vip_preco = document.getElementById("vip_"+id)?.value;
  const agencia_id = document.getElementById("agencia_"+id)?.value;
  const motivo = document.getElementById("motivo_"+id)?.value;

  // 🔥 CONFIRMAÇÃO ESPECIAL PARA PROMOÇÃO
  if(tipo === "cliente" && status === "aprovado"){
    const confirmar = confirm(
      "Tem certeza que deseja PROMOVER este cliente para MODELO?\n\n" +
      "• A role será alterada para 'modelo'\n" +
      "• Os dados serão migrados\n" +
      "• O processo não deve ser revertido manualmente"
    );

    if(!confirmar) return;
  }

  // 🔥 Confirmação simples para validar modelo
  if(tipo === "modelo" && status === "aprovado"){
    const confirmar = confirm(
      "Confirmar validação deste modelo?"
    );

    if(!confirmar) return;
  }

  // 🔥 Confirmação para rejeição
  if(status === "rejeitado"){
    if(!motivo){
      alert("Informe o motivo da rejeição.");
      return;
    }

    const confirmar = confirm(
      "Confirmar REJEIÇÃO deste perfil?"
    );

    if(!confirmar) return;
  }

  let url;

  if(tipo === "cliente"){
    url = "/admin/validar-cliente/" + id;
  } else {
    url = "/api/admin/validar-modelo/" + id;
  }

  const res = await fetch(url,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer "+token
    },
    body:JSON.stringify({
      status,
      motivo_rejeicao: motivo,
      agencia_id,
      vip_preco
    })
  });

  if(!res.ok){
    const err = await res.json();
    alert(err.error || "Erro ao validar");
    return;
  }

  carregarPerfis();
}

async function aprovar(id){
  await fetch("/api/admin/aprovar/"+id,{
    method:"PUT",
    headers:{ Authorization:"Bearer "+token }
  });

  carregarPerfis();
}

async function carregarAgencias(){

  const res = await fetch("/api/admin/agencias",{
    headers:{ Authorization:"Bearer "+token }
  });

  if(!res.ok){
    alert("Erro ao carregar agências");
    return;
  }

  listaAgencias = await res.json();
}

function trocarStatus(status, btn){

  statusAtual = status;

  document.querySelectorAll(".filtro-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  carregarPerfis();
}

function renderPaginacao(totalPages, page){

  const container = document.getElementById("listaPerfis");

  if(totalPages <= 1) return;

  container.innerHTML += `
    <div class="paginacao">
      <button onclick="mudarPagina(${page-1})" ${page===1?'disabled':''}>
        Anterior
      </button>

      <span>Página ${page} de ${totalPages}</span>

      <button onclick="mudarPagina(${page+1})" ${page===totalPages?'disabled':''}>
        Próxima
      </button>
    </div>
  `;
}

function mudarPagina(novaPagina){
  paginaAtual = novaPagina;
  carregarPerfis();
}

(async ()=>{
  await carregarAgencias();
  await carregarPerfis();
})();

</script>

</body>
</html>
