<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPVs Enviados - Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      color: #e2e2e2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #1a1a24;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar input[type="search"] {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e2e2e2;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      width: 200px;
    }

    .toolbar input[type="search"]:focus { border-color: #7b2cff; }
    .toolbar-spacer { flex: 1; }
    .toolbar-info { font-size: 12px; color: #888; }

    .btn-reset {
      background: transparent;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #aaa;
      cursor: pointer;
      padding: 7px 12px;
      font-size: 12px;
    }

    .btn-reset:hover { border-color: #7b2cff; color: #fff; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #14141e;
      border-right: 1px solid #2a2a3a;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #666;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
    }

    .modelo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #1e1e2a;
      transition: background 0.15s;
      font-size: 13px;
    }

    .modelo-item:hover { background: #1e1e2e; }
    .modelo-item.active { background: #2a1a4a; border-left: 3px solid #7b2cff; }

    .modelo-item .nome {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modelo-item .badge {
      background: #7b2cff22;
      color: #9b6cff;
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 11px;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .modelo-item-all {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #9b6cff;
      border-bottom: 1px solid #2a2a3a;
    }

    .modelo-item-all:hover,
    .modelo-item-all.active { background: #2a1a4a; }

    .main-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #14141e;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
    }

    .filter-bar select {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e2e2e2;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
    }

    .filter-bar select:focus { border-color: #7b2cff; }
    .filter-bar-label { font-size: 12px; color: #666; }
    .filter-bar-spacer { flex: 1; }

    .table-wrap { flex: 1; overflow: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      background: #1a1a24;
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #2a2a3a;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr {
      border-bottom: 1px solid #1e1e2a;
      cursor: pointer;
      transition: background 0.12s;
    }

    tbody tr:hover { background: #1e1e2e; }
    tbody td { padding: 10px 14px; vertical-align: middle; }

    .td-thumb { width: 54px; padding: 6px 10px; }

    .td-thumb img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      background: #2a2a3a;
    }

    .td-thumb .no-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #555;
    }

    .text-truncate {
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ccc;
    }

    .text-muted { color: #666; font-size: 12px; }

    .badge-tipo {
      display: inline-block;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-tipo.mass { background: #7b2cff22; color: #9b6cff; }
    .badge-tipo.individual { background: #1a7aff22; color: #5aaaff; }

    .midias-count {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #888;
      font-size: 12px;
    }

    .price-tag { color: #4caf50; font-weight: 600; white-space: nowrap; }

    .enviados-count { color: #888; font-size: 12px; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #2a2a3a;
      flex-shrink: 0;
    }

    .pagination button {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e2e2e2;
      cursor: pointer;
      padding: 6px 14px;
      font-size: 13px;
    }

    .pagination button:hover:not(:disabled) { background: #2a1a4a; border-color: #7b2cff; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination span { font-size: 12px; color: #888; }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: #555;
      gap: 8px;
      font-size: 14px;
      padding: 60px;
      text-align: center;
    }

    .empty-icon { font-size: 48px; margin-bottom: 8px; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: #555;
      font-size: 14px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a3a;
      border-top-color: #7b2cff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MODAL ===== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: #000b;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 660px;
      max-height: 90vh;
      background: #1a1a24;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #2a2a3a;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
    }

    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-meta { font-size: 12px; color: #888; margin-top: 4px; }

    .modal-close {
      background: none;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .modal-close:hover { color: #fff; }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #555;
      margin-bottom: 8px;
    }

    .modal-text-box {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #ddd;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .modal-info-card {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .modal-info-card .label { font-size: 11px; color: #666; margin-bottom: 4px; }
    .modal-info-card .value { font-size: 13px; color: #e2e2e2; font-weight: 500; }
    .modal-info-card .value.green { color: #4caf50; }
    .modal-info-card .value.purple { color: #9b6cff; }

    .midias-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }

    .midia-thumb {
      position: relative;
      aspect-ratio: 9/16;
      border-radius: 8px;
      overflow: hidden;
      background: #0f0f13;
      cursor: pointer;
      border: 1px solid #2a2a3a;
    }

    .midia-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .midia-thumb .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #ffffffcc;
      pointer-events: none;
    }

    .midia-thumb:hover { opacity: 0.82; }

    .no-midias { color: #555; font-size: 13px; }

    /* ===== VIEWER ===== */
    .viewer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: #000d;
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .viewer-backdrop.open { display: flex; }

    .viewer-box { position: relative; max-width: 90vw; max-height: 90vh; }

    .viewer-box img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }

    .viewer-box iframe {
      width: 70vw;
      height: 70vh;
      border: none;
      border-radius: 8px;
    }

    .viewer-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Buscar modelo..." oninput="filtrarModelos()">
  <div class="toolbar-spacer"></div>
  <span class="toolbar-info" id="totalInfo">Carregando...</span>
  <button class="btn-reset" onclick="resetFiltros()">Limpar filtros</button>
</div>

<div class="layout">

  <div class="sidebar">
    <div class="sidebar-header">Modelos</div>
    <div class="modelo-item-all active" onclick="selecionarModelo(null, this)">Todos os modelos</div>
    <div id="modelosList"></div>
  </div>

  <div class="main-area">
    <div class="filter-bar">
      <span class="filter-bar-label">Tipo:</span>
      <select id="filtroTipo" onchange="carregar(1)">
        <option value="">Todos</option>
        <option value="conteudo_ppv_mass">Mass PPV</option>
        <option value="conteudo_ppv">PPV Individual</option>
        <option value="ppv">PPV</option>
      </select>
      <div class="filter-bar-spacer"></div>
      <select id="filtroLimite" onchange="carregar(1)">
        <option value="20">20 por página</option>
        <option value="50">50 por página</option>
        <option value="100">100 por página</option>
      </select>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="loading"><div class="spinner"></div> Carregando PPVs...</div>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
      <button id="btnAnterior" onclick="carregar(paginaAtual - 1)">← Anterior</button>
      <span id="paginaInfo"></span>
      <button id="btnProxima" onclick="carregar(paginaAtual + 1)">Próxima →</button>
    </div>
  </div>
</div>

<!-- MODAL DETALHE -->
<div class="modal-backdrop" id="modalBackdrop" onclick="fecharModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h3 id="modalTitulo">PPV</h3>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- VIEWER MÍDIA -->
<div class="viewer-backdrop" id="viewerBackdrop" onclick="fecharViewer()">
  <div class="viewer-box" id="viewerBox">
    <button class="viewer-close" onclick="fecharViewer()">×</button>
  </div>
</div>

<script>
  let modeloSelecionado = null;
  let paginaAtual = 1;
  let totalPaginas = 1;

  async function fetchAdmin(path) {
    const res = await fetch('/admin/dashboard' + path, { credentials: 'same-origin' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function carregarModelos() {
    const lista = document.getElementById('modelosList');
    lista.innerHTML = '<div style="padding:12px;color:#555;font-size:12px;">Carregando...</div>';
    try {
      const rows = await fetchAdmin('/ppvs-admin/modelos');
      lista.innerHTML = '';
      rows.forEach(m => {
        const el = document.createElement('div');
        el.className = 'modelo-item';
        el.dataset.id = m.id;
        el.dataset.nome = (m.nome || '').toLowerCase();
        el.innerHTML = `<span class="nome" title="${m.nome}">${m.nome}</span><span class="badge">${m.total_ppvs}</span>`;
        el.onclick = () => selecionarModelo(m.id, el);
        lista.appendChild(el);
      });
    } catch {
      lista.innerHTML = '<div style="padding:12px;color:#f55;font-size:12px;">Erro ao carregar</div>';
    }
  }

  function filtrarModelos() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('#modelosList .modelo-item').forEach(el => {
      el.style.display = el.dataset.nome.includes(q) ? '' : 'none';
    });
  }

  function selecionarModelo(id, el) {
    modeloSelecionado = id;
    document.querySelectorAll('.modelo-item, .modelo-item-all').forEach(e => e.classList.remove('active'));
    if (el) el.classList.add('active');
    carregar(1);
  }

  async function carregar(pagina = 1) {
    paginaAtual = pagina;
    const wrap = document.getElementById('tableWrap');
    const tipo   = document.getElementById('filtroTipo').value;
    const limite = document.getElementById('filtroLimite').value;

    wrap.innerHTML = '<div class="loading"><div class="spinner"></div> Carregando PPVs...</div>';
    document.getElementById('pagination').style.display = 'none';

    let qs = `?page=${pagina}&limit=${limite}`;
    if (modeloSelecionado) qs += `&modelo_id=${modeloSelecionado}`;
    if (tipo) qs += `&tipo=${tipo}`;

    try {
      const data = await fetchAdmin('/ppvs-admin' + qs);
      totalPaginas = data.totalPages || 1;
      document.getElementById('totalInfo').textContent = `${data.total} PPV(s) enviado(s)`;

      if (!data.rows.length) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">💌</div>Nenhum PPV encontrado.</div>`;
        return;
      }

      const table = document.createElement('table');
      table.innerHTML = `
        <thead><tr>
          <th class="td-thumb"></th>
          <th>Modelo</th>
          <th>Texto</th>
          <th>Preço</th>
          <th>Mídias</th>
          <th>Tipo</th>
          <th>Enviados</th>
          <th>Data</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      `;
      wrap.innerHTML = '';
      wrap.appendChild(table);

      const tbody = document.getElementById('tableBody');
      data.rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.onclick = () => abrirDetalhe(r.id);

        const isMass = r.tipo === 'conteudo_ppv_mass';
        const tipoBadge = isMass
          ? '<span class="badge-tipo mass">Mass PPV</span>'
          : '<span class="badge-tipo individual">Individual</span>';

        const thumb = r.thumb
          ? `<img src="${r.thumb}" alt="" onerror="this.parentNode.innerHTML='<div class=no-thumb>🔒</div>'">`
          : `<div class="no-thumb">🔒</div>`;

        const data_fmt = new Date(r.created_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

        tr.innerHTML = `
          <td class="td-thumb">${thumb}</td>
          <td><strong>${r.modelo_nome || '#' + r.modelo_id}</strong></td>
          <td><div class="text-truncate">${r.text ? escHtml(r.text) : '<span class="text-muted">sem texto</span>'}</div></td>
          <td><span class="price-tag">€ ${Number(r.preco).toFixed(2)}</span></td>
          <td><span class="midias-count">🖼 ${r.total_midias}</span></td>
          <td>${tipoBadge}</td>
          <td><span class="enviados-count">${isMass ? r.total_enviados + ' dest.' : '—'}</span></td>
          <td><span class="text-muted">${data_fmt}</span></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('paginaInfo').textContent = `${paginaAtual} / ${totalPaginas}`;
      document.getElementById('btnAnterior').disabled = paginaAtual <= 1;
      document.getElementById('btnProxima').disabled  = paginaAtual >= totalPaginas;
      document.getElementById('pagination').style.display = 'flex';

    } catch (e) {
      wrap.innerHTML = `<div class="empty">Erro ao carregar: ${escHtml(e.message)}</div>`;
    }
  }

  async function abrirDetalhe(id) {
    document.getElementById('modalTitulo').textContent = 'Carregando...';
    document.getElementById('modalMeta').textContent = '';
    document.getElementById('modalBody').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    document.getElementById('modalBackdrop').classList.add('open');

    try {
      const d = await fetchAdmin('/ppvs-admin/' + id);

      document.getElementById('modalTitulo').textContent = `PPV — ${d.modelo_nome || '#' + d.modelo_id}`;
      document.getElementById('modalMeta').textContent =
        `${new Date(d.created_at).toLocaleString('pt-BR')} · ${d.tipo}`;

      const isMass = d.tipo === 'conteudo_ppv_mass';

      let midiasHtml = '';
      if (d.midias && d.midias.length) {
        midiasHtml = `
          <div>
            <div class="modal-section-label">Mídias anexadas (${d.midias.length})</div>
            <div class="midias-grid">
              ${d.midias.map(m => {
                const isVid = m.tipo === 'video';
                const thumb = m.thumbnail_url || obterThumbVideo(m.url) || m.url;
                return `
                  <div class="midia-thumb" onclick='abrirViewer(${JSON.stringify(m)})'>
                    <img src="${thumb}" alt="" onerror="this.style.opacity='0.2'">
                    ${isVid ? '<div class="play-icon">▶</div>' : ''}
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      } else {
        midiasHtml = `
          <div>
            <div class="modal-section-label">Mídias anexadas</div>
            <div class="no-midias">Nenhuma mídia neste PPV.</div>
          </div>`;
      }

      document.getElementById('modalBody').innerHTML = `
        <div>
          <div class="modal-section-label">Texto enviado</div>
          <div class="modal-text-box">${d.text ? escHtml(d.text) : '<em style="color:#555">Sem texto</em>'}</div>
        </div>
        <div class="modal-info-grid">
          <div class="modal-info-card">
            <div class="label">Modelo</div>
            <div class="value purple">${d.modelo_nome || '#' + d.modelo_id}</div>
          </div>
          <div class="modal-info-card">
            <div class="label">Preço</div>
            <div class="value green">€ ${Number(d.preco).toFixed(2)}</div>
          </div>
          <div class="modal-info-card">
            <div class="label">Tipo</div>
            <div class="value">${isMass ? 'Mass PPV' : 'PPV Individual'}</div>
          </div>
          <div class="modal-info-card">
            <div class="label">Data/Hora</div>
            <div class="value">${new Date(d.created_at).toLocaleString('pt-BR')}</div>
          </div>
        </div>
        ${midiasHtml}
      `;
    } catch (e) {
      document.getElementById('modalBody').innerHTML =
        `<div class="empty">Erro: ${escHtml(e.message)}</div>`;
    }
  }

  function fecharModal(e) {
    if (e && e.target !== document.getElementById('modalBackdrop')) return;
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  function abrirViewer(m) {
    const box = document.getElementById('viewerBox');
    Array.from(box.children).forEach(c => { if (!c.classList.contains('viewer-close')) c.remove(); });
    const el = document.createElement('div');
    if (m.tipo === 'video') {
      const vid = extrairVideoId(m.url);
      el.innerHTML = vid
        ? `<iframe src="https://iframe.videodelivery.net/${vid}" allow="autoplay; fullscreen" allowfullscreen></iframe>`
        : `<video src="${m.url}" controls style="max-width:90vw;max-height:90vh;border-radius:8px;"></video>`;
    } else {
      el.innerHTML = `<img src="${m.url}" alt="mídia">`;
    }
    box.appendChild(el);
    document.getElementById('viewerBackdrop').classList.add('open');
  }

  function fecharViewer() {
    document.getElementById('viewerBackdrop').classList.remove('open');
    const box = document.getElementById('viewerBox');
    Array.from(box.children).forEach(c => { if (!c.classList.contains('viewer-close')) c.remove(); });
  }

  function resetFiltros() {
    document.getElementById('filtroTipo').value = '';
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.modelo-item, .modelo-item-all').forEach(e => e.classList.remove('active'));
    document.querySelector('.modelo-item-all').classList.add('active');
    document.querySelectorAll('#modelosList .modelo-item').forEach(e => e.style.display = '');
    modeloSelecionado = null;
    carregar(1);
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function obterThumbVideo(url) {
    if (!url) return null;
    const m = url.match(/videodelivery\.net\/([^/?]+)|iframe\.videodelivery\.net\/([^/?]+)/);
    return m ? `https://videodelivery.net/${m[1]||m[2]}/thumbnails/thumbnail.jpg` : null;
  }

  function extrairVideoId(url) {
    if (!url) return null;
    const m = url.match(/iframe\.videodelivery\.net\/([^/?]+)/) || url.match(/videodelivery\.net\/([^/?]+)/);
    return m ? m[1] : null;
  }

  carregarModelos();
  carregar(1);
</script>
</body>
</html>
