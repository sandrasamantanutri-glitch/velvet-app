<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Perfis Aprovados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <img src="/assets/velvet.png" class="logo-small">
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/modelos.html">Modelos</a>
      <a href="/admin/validar.html" class="active">Validar Perfis</a>
    </nav>
  </div>

  <div class="topbar-right filtros">
<div class="filtro-status">
  <button class="filtro-btn" onclick="trocarStatus('em_analise', this)">Pendentes</button>
  <button class="filtro-btn active" onclick="trocarStatus('aprovado', this)">Aprovados</button>
  <button class="filtro-btn" onclick="trocarStatus('rejeitado', this)">Rejeitados</button>
<button class="logout-btn" onclick="logoutAdmin()">Sair</button>
  </div>
</header>

<div class="main clean">
  <h1>Perfis Aprovados</h1>

  <div id="listaAprovados"></div>

  <div class="paginacao" id="paginacao"></div>
</div>

<script>

const token = localStorage.getItem("token_admin");

if (!token) {
  window.location.href = "/admin/login.html";
  throw new Error("Sem token admin");
}

function logoutAdmin() {
  localStorage.removeItem("token_admin");
  window.location.href = "/admin/login.html";
}

async function carregarAprovados(page = 1) {

  const res = await fetch(`/api/admin/verificacoes-aprovadas?page=${page}`, {
    headers: {
      Authorization: "Bearer " + token
    }
  });

  if (!res.ok) {
    alert("Erro ao carregar aprovados");
    return;
  }

  const data = await res.json();
  const perfis = data.dados;
  const container = document.getElementById("listaAprovados");

  if (!perfis.length) {
    container.innerHTML = `
      <div class="card">
        <p>Nenhum perfil aprovado.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = perfis.map(p => `
    <div class="card validar-card">

      <div class="titulo-badge">
        <h3>${p.nome_exibicao || "Sem nome"}</h3>
        <span class="badge-tipo ${p.tipo}">
          ${p.tipo}
        </span>
      </div>

      <div class="validar-docs">

        ${p.doc_frente_url ? `
          <div class="doc-item">
            <span>Documento Frente</span>
            <a href="${p.doc_frente_url}" target="_blank">
              <img src="${p.doc_frente_url}">
            </a>
          </div>
        ` : `
          <div class="doc-item vazio">
            <div class="img-vazia">Sem frente</div>
          </div>
        `}

        ${p.doc_verso_url ? `
          <div class="doc-item">
            <span>Documento Verso</span>
            <a href="${p.doc_verso_url}" target="_blank">
              <img src="${p.doc_verso_url}">
            </a>
          </div>
        ` : `
          <div class="doc-item vazio">
            <div class="img-vazia">Sem verso</div>
          </div>
        `}

        ${p.selfie_url ? `
          <div class="doc-item">
            <span>Selfie</span>
            <a href="${p.selfie_url}" target="_blank">
              <img src="${p.selfie_url}">
            </a>
          </div>
        ` : `
          <div class="doc-item vazio">
            <div class="img-vazia">Sem selfie</div>
          </div>
        `}

      </div>

      <div class="dados-ok">
        Aprovado em: ${new Date(p.verificado_em).toLocaleString()}
      </div>

    </div>
  `).join("");

  renderPaginacao(data.totalPages, data.page);
}

function renderPaginacao(totalPages, page) {
  const paginacao = document.getElementById("paginacao");

  if (totalPages <= 1) {
    paginacao.innerHTML = "";
    return;
  }

  paginacao.innerHTML = `
    <button ${page === 1 ? "disabled" : ""}
      onclick="carregarAprovados(${page - 1})">
      Anterior
    </button>

    <span>Página ${page} de ${totalPages}</span>

    <button ${page === totalPages ? "disabled" : ""}
      onclick="carregarAprovados(${page + 1})">
      Próxima
    </button>
  `;
}
carregarAprovados();
</script>


</body>
</html>
