<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN - Velvet</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  color:#fff;
}

.card{
  background:#c9c9c9a4;
  padding:40px;
  width:350px;
  border-radius:14px;
  box-shadow:#7B2CFF;
}

h2{
  text-align:center;
  margin-bottom:30px;
  color:#7B2CFF;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:none;
  border-radius:8px;
  background:#f1f1f1;
  color:#1E1E26;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#7B2CFF;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  width:200px;
  display:block;
  margin:0 auto;
}

button:hover{
  background:#9E6BFF;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  display: flex;
  align-items: center;
  padding-left: 20px;
}

.logo {
  height: 100px;
  width: auto;
}
</style>
</head>

<body>

<header class="header">
  <img src="/assets/velvet.png" alt="Velvet" class="logo">
</header>

<div class="card">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
async function login(){
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  const res = await fetch("/api/admin/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({email,senha})
  });

  const data = await res.json();

  if(res.ok){
    localStorage.setItem("token", data.token);
    window.location.href="/admin/dashboard.html";
  }else{
    alert(data.error || "Erro ao fazer login");
  }
}
</script>

</body>
</html>
