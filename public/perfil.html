<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
   <title>Perfil </title>
  <link rel="stylesheet" href="/perfil.css">
   <link rel="stylesheet" href="/pag.css">

</head>
<body>

<header class="app-header">
  <div class="header-inner">
   <img src="/assets/velvet.png" alt="Velvet" class="velvet-logo">
   <a href="/feed.html" title="Feed"><img src="/assets/feed.png" alt="Feed"></a>
   <a href="/perfil.html" title="Perfil"><img src="/assets/perfil.png" alt="Perfil"></a>
   <button id="btnMensagem"><img src="assets/chat.png" alt="Chat"><span id="badgeUnread" class="badge-unread hidden">0</span></button>
  </div>

</header>

<main class="page-container">

<div class="perfil-card">
  <div class="perfil-capa">
    <img id="profileCapa" src="/assets/capa.png" alt="Capa da modelo">
  </div>

  <div class="perfil-avatar">
    <img id="profileAvatar" src="/assets/avatar.png" alt="Avatar da modelo">
  </div>

  <div class="perfil-nome" id="profileName"></div>

  <div class="perfil-bio" id="profileBio"></div>

  <div class="local-icons"> <img src="/assets/local.png" alt="Local"><span id="local-texto"></span>
  </div>

  <div class="icon-group">
    <img src="/assets/insta.png" alt="Instagram">
    <img src="/assets/tiktok.png" alt="TikTok">
  </div>
  
  <div class="oferta-card" id="oferta-card">

  <div class="oferta-titulo">💎 Oferta Assinatura</div>

  <div class="oferta-botao-wrapper">
  <span class="oferta-balao" id="oferta-desconto"></span>

    <button class="oferta-botao" id="btn-assinar">
      Assinar agora por <span id="preco-desconto"></span>
    </button>
  </div>

  <div class="oferta-preco-original">
    Preço original:
    <span id="preco-original"></span>
  </div>
  </div>

<div class="midias-section">

  <div class="midias-topo">
    <a href="#" class="btn-upload" title="upload">
      <img src="/assets/more.png" alt="Carregar Midias">
    </a>

    <input
      type="file"
      id="inputUpload"
      accept="image/*,video/*"
      hidden
    />

    <div class="midias-tabs">
      <button class="tab active" data-tab="free">🎁 Pra você</button>
      <button class="tab" data-tab="paid">🔥 Especial</button>
    </div>
  </div>

  <!-- 🔥 GRID TEM QUE ESTAR AQUI DENTRO -->
  <div class="midias-grid active" id="listaMidias"></div>
  <div class="midias-grid" id="midias-paid"></div>

</div>

<!-- MODAL VISUALIZAÇÃO MÍDIA -->
<div id="modalMidia" class="modal-midia hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-conteudo">
    <button id="fecharModal" style="align-self:flex-end;">✕</button>

    <img id="modalImg" style="display:none; max-width:100%;" />
    <video id="modalVideo" controls style="display:none; max-width:100%;"></video>
  </div>
</div>

<div id="popupPagamentoVelvet" class="velvet-modal hidden">
  <div class="velvet-backdrop"></div>

  <div class="velvet-box">
    <button class="velvet-close" onclick="fecharPopupPagamento()">×</button>

    <h2 class="velvet-title">Finalizar pagamento</h2>

    <div class="velvet-tabs">
      <button class="tab active" onclick="mostrarMetodo('pix')">⚡ Pix</button>
      <button class="tab" onclick="mostrarMetodo('cartao')">💳 Cartão</button>
    </div>
  </div>
</div>

<!-- POPUP PAGAMENTO VELVET -->
<div id="popupPagamentoVelvet" class="velvet-modal hidden">
  <div class="velvet-backdrop" onclick="fecharPopupPagamento()"></div>

  <div class="velvet-box">
    <button class="velvet-close" onclick="fecharPopupPagamento()">×</button>

    <h2 class="velvet-title">Finalizar pagamento</h2>

    <!-- Abas -->
    <div class="velvet-tabs">
<button class="tab active" data-metodo="pix" onclick="mostrarMetodo('pix')">
  ⚡ Pix
</button>
<button class="tab" data-metodo="cartao" onclick="mostrarMetodo('cartao')">
  💳 Cartão
</button>

    </div>

    <div class="velvet-content">

      <!-- PIX -->
      <div id="conteudoPix" class="metodo">
        <p class="info">Escaneie o QR Code ou copie o código Pix</p>

        <!-- status -->
        <div id="pixLoading" class="pix-loading">
          <div class="spinner"></div>
          <span>Gerando Pix…</span>
        </div>

        <div id="pixAguardando" class="pix-aguardando hidden">
          ⏳ Aguardando pagamento Pix
        </div>

        <div id="pixSucesso" class="pix-sucesso hidden">
          ✅ Pagamento confirmado!
        </div>

        <img id="pixQr" class="pix-qr hidden" />
        <input id="pixCodigo" type="text" readonly class="hidden" />

        <button class="btn-secundario hidden" onclick="copiarPix()">
          Copiar código Pix
        </button>
      </div>

      <!-- CARTÃO -->
      <div id="conteudoCartao" class="metodo hidden">

        <div id="cartaoLoading" class="cartao-loading">
          <div class="spinner"></div>
          <span>Preparando pagamento…</span>
        </div>

        <form id="formCartao" class="hidden">
          <div id="card-element"></div>

          <button type="submit" class="btn-principal">
            Confirmar pagamento
          </button>
        </form>

        <div id="cartaoSucesso" class="cartao-sucesso hidden">
          ✅ Pagamento confirmado!
        </div>

      </div>

    </div>
  </div>
</div>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/pag.js"></script>
<script src="/profile.js"></script>

</body>
</html>
