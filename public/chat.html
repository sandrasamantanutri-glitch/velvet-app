<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Chat</title>
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/chatmodelo.css">
</head>

<body class="role-modelo">
  <div id="header-container"></div>

<header class="chat-topo">
  <button type="button" class="btn-voltar" onclick="window.location.href='/inbox.html'">
    <img src="/assets/voltar.png" alt="Voltar">
  </button>

  <div class="chat-cliente-info">
    <img id="chatClienteAvatar" class="chat-avatar" src="/assets/avatar.png" alt="Avatar cliente" />

    <div class="chat-cliente-texto">
      <div class="chat-nome-linha">
        <div id="chatClienteNome" class="chat-nome">Cliente</div>

        <span id="chatClienteResumo" class="chat-cliente-resumo" style="display:none;"></span>

        <button
          id="btnAnotacoesCliente"
          type="button"
          class="btn-anotacoes-cliente"
          title="Anotações privadas">
          ✎
        </button>
      </div>

      <div id="chatClienteStatus" class="chat-status">carregando…</div>
    </div>
  </div>

  <button
    id="btnTransacoesCliente"
    type="button"
    class="btn-transacoes-cliente"
    title="Ver transações do cliente">
    $
  </button>
</header>


<!-- ÁREA DE MENSAGENS -->
<main id="chatBox" class="chat-box"></main>

<!-- INPUT FIXO -->

<footer class="chat-input">
  <button
    id="btnEnviarConteudo1"
    class="btn-midia"
    onclick="abrirPopupConteudos()"
    aria-label="Enviar mídia"
  >
    <img src="/assets/midia.png" alt="Mídia" />
  </button>

  <input
    id="msgInput"
    type="text"
    placeholder="Digite uma mensagem..."
    autocomplete="off"/>

  <button
    class="btn-enviar1"
    onclick="enviarMensagem()"
    aria-label="Enviar mensagem"
  >
    <img src="/assets/enviar.png" alt="Enviar" />
  </button>
</footer>

<div id="popupConteudos" class="hidden">
  <div class="popup-backdrop" onclick="fecharPopupConteudos()"></div>
  <div class="popup-box">
    <h3>Enviar conteúdo</h3>

    <div class="preview-scroll">
      <div id="previewConteudos" class="preview-grid"></div>
    </div>

    <div class="popup-preco">
      <label>Preço (R$)</label>
      <input type="number" id="precoConteudo" value="0" min="0" />
    </div>

    <div class="popup-actions">
      <button class="btn-cancelar" onclick="fecharPopupConteudos()">Cancelar</button>
      <button class="btn-enviar" onclick="confirmarEnvioConteudo()">Enviar</button>
    </div>
  </div>

</div>

<div id="menuMensagem" class="hidden">
  <div class="popup-backdrop" onclick="fecharMenuMensagem()"></div>

  <div class="popup-box">
    <h3>Mensagem</h3>

    <textarea id="editarTexto" placeholder="Editar mensagem..."></textarea>

    <div class="popup-actions">
      <button onclick="salvarEdicao()">Salvar</button>
      <button onclick="excluirMensagem()">Excluir</button>
      <button onclick="fecharMenuMensagem()">Cancelar</button>
    </div>
  </div>
 </div>

  <div id="popupAnotacoesCliente" class="popup-anotacoes hidden">
    <div class="popup-anotacoes-backdrop"></div>

    <div class="popup-anotacoes-box">
      <button id="fecharPopupAnotacoes" class="popup-anotacoes-fechar" type="button">×</button>

      <h3>Anotações privadas</h3>

      <label for="inputResumoCliente">Resumo curto</label>
      <input
        id="inputResumoCliente"
        type="text"
        maxlength="120"
        placeholder="Ex: compra VIP, gosta de áudio, responde à noite">

      <label for="textareaNotaCliente">Informações privadas</label>
      <textarea
        id="textareaNotaCliente"
        rows="8"
        placeholder="Escreve aqui observações que só a modelo pode ver..."></textarea>

      <div class="popup-anotacoes-acoes">
        <button id="salvarAnotacoesCliente" type="button">Salvar</button>
      </div>
    </div>
  </div>

<div id="modalMidia" class="modal-midia hidden">

  <div class="modal-backdrop" onclick="fecharModalMidia()"></div>

  <div class="modal-box modal-midia-box">

    <button class="modal-close" onclick="fecharModalMidia()">✕</button>

    <img id="modalImg">

    <video id="modalVideo" controls playsinline preload="metadata"></video>

    <iframe
      id="modalIframe"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="/chat.js" defer></script>
</body>
</html>
