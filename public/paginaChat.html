<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Velvet • Chat</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/chat-app.css">
</head>

<body>

  <!-- TOPO DO CHAT -->
  <header class="chat-topo">
    <button id="btnVoltar">←</button>
    <img id="chatAvatar" class="chat-avatar" />
    <strong id="chatNome">Chat</strong>
  </header>

  <!-- MENSAGENS -->
  <main id="chatMensagens" class="chat-mensagens"></main>

  <!-- INPUT -->
  <footer class="chat-input">
    <input id="chatInput" placeholder="Mensagem..." autocomplete="off" />
    <button id="chatEnviar">Enviar</button>
  </footer>

  <!-- SOCKET + CHAT -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/paginaChat.js"></script>

</body>
</html>
