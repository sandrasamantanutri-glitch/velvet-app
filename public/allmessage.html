<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Mensagem para Assinantes</title>
  <link rel="stylesheet" href="/allmessage.css">
</head>

<body>
 <div id="header-container"></div>

 <section class="area-card">
    <button type="button" class="btn-voltar" onclick="history.back()">
      <img src="/assets/voltar.png" alt="Voltar">
    </button>

<div class="page-wrapper">

  <header class="topbar">
    <h1>Envio de Mensagens - PPV</h1>
    <span>Envio de mensagem a todos assinantes por modelo</span>
  </header>

  <main class="container">

    <!-- MODELO -->
    <div class="card">
      <label>Modelo</label>
      <select id="modeloSelect"></select>
    </div>

    <!-- TEXTO -->
    <div class="card">
      <label>Mensagem</label>
      <textarea id="mensagem"></textarea>
    </div>

    <!-- CONTEÚDOS -->
<div class="card">
  <label>Conteúdos da modelo</label>

  <button
    type="button"
    class="btn secondary"
    id="btnAbrirConteudos"
  >
    Selecionar mídias
  </button>

  <div id="conteudosSelecionados" class="preview"></div>
</div>


    <!-- PREÇO -->
    <div class="card">
      <label>Preço (€)</label>
      <input type="number" id="preco" min="1" step="0.01" />
    </div>

    <!-- AÇÕES -->
    <div class="actions">
      <button id="btnEnviar" class="btn">Enviar para todos</button>
    </div>

  </main>
</div>

<div id="popupConteudos" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-box modal-scroll">
    <h3>Selecionar conteúdos</h3>

    <div id="conteudosGrid" class="conteudos-grid"></div>

    <!-- PAGINAÇÃO -->
    <div class="paginacao">
      <button id="btnConteudosPrev">←</button>
      <span id="paginaConteudosInfo">1 / 1</span>
      <button id="btnConteudosNext">→</button>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" id="btnFecharConteudos">
        Fechar
      </button>
      <button class="btn" id="btnConfirmarConteudos">
        Usar conteúdos selecionados
      </button>
    </div>

  </div>
</div>

    <script>
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("token");

  if (!token) {
    alert("Para ter acesso a essa página deve fazer seu login ou seu cadastro.");

    window.location.href = "/index.html";
    return;
  }

});
</script>

<script src="/socket.io/socket.io.js"></script>
<script src="allmessage.js"></script>
<script src="/header.js">defer</script>
</body>
</html>
