<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Velvet | Envio de Mensagens - PPV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="allmessage.css" />
</head>

<body>
<div class="page-wrapper">

  <header class="topbar">
    <h1>Envio de Mensagens - PPV</h1>
    <span>Envio de mensagem a todos assinantespor modelo</span>
  </header>

  <main class="container">

    <!-- MODELO -->
    <div class="card">
      <label>Modelo</label>
      <select id="modeloSelect"></select>
    </div>

    <!-- TEXTO -->
    <div class="card">
      <label>Mensagem</label>
      <textarea id="mensagem"></textarea>
    </div>

    <!-- CONTEÚDOS -->
    <div class="card">
      <label>Conteúdos da modelo</label>
      <div id="conteudosGrid" class="preview"></div>
    </div>

    <!-- PREÇO -->
    <div class="card">
      <label>Preço (€)</label>
      <input type="number" id="preco" min="1" step="0.01" />
    </div>

    <!-- AÇÕES -->
    <div class="actions">
      <button id="btnTeste" class="btn secondary">Enviar teste</button>
      <button id="btnEnviar" class="btn">Enviar para todos</button>
    </div>

    <p class="alert">
      ⚠️ Será enviado apenas para assinantes da modelo selecionada.
    </p>

  </main>
</div>

<script src="allmessage.js"></script>
</body>
</html>
