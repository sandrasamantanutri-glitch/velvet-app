<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Ganhos | Velvet</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/header.css" rel="stylesheet">
<link href="/css/relatorio.css" rel="stylesheet">
<style>
.g-wrap { max-width: 540px; margin: 0 auto; padding-bottom: 80px; }

.g-topo {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 8px;
  position: sticky; top: 64px; z-index: 40;
  background: linear-gradient(180deg, #fbfaff 85%, transparent 100%);
}
.btn-voltar {
  border: none; background: none; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; color: var(--purple); font-size: 1.2rem;
  text-decoration: none; transition: transform .2s;
}
.btn-voltar:hover { transform: scale(1.1); }
.g-titulo { flex: 1; font-size: 18px; font-weight: 700; color: var(--purple); margin: 0; }

.spin-wrap { display: flex; justify-content: center; padding: 3rem 0; }
.spin { width: 30px; height: 30px; border: 3px solid #e2d9ff; border-top-color: var(--purple); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

.hist-header {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
}
.hist-body { display: none; padding-top: 10px; }
.hist-body.open { display: block; }
.hist-chevron { transition: transform .2s; color: var(--purple-light); font-size: .9rem; }
.hist-header.open .hist-chevron { transform: rotate(180deg); }
</style>
</head>
<body>

<div id="header-container"></div>

<div class="g-wrap">
  <div class="g-topo">
    <a class="btn-voltar" href="/areaUsuario.html"><i class="bi bi-arrow-left"></i></a>
    <h1 class="g-titulo">Meus Ganhos</h1>
    <select class="rel-filtro-mes" id="monthSel" onchange="onMonthChange()" style="flex:0 0 auto;width:auto"></select>
  </div>
  <div style="padding:0 16px">
    <div id="ganhoContent">
      <div class="spin-wrap"><div class="spin"></div></div>
    </div>
  </div>
</div>

<script src="/js/header.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/'; }

const fmt = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MES  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function currentYM() {
  const partes = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit'
  }).formatToParts(new Date());
  return `${partes.find(p => p.type === 'year').value}-${partes.find(p => p.type === 'month').value}`;
}

function todaySP() {
  return new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo' }).format(new Date());
}

function buildMonthOptions(selectedYM) {
  const el = document.getElementById('monthSel');
  el.innerHTML = '';
  const now = new Date();
  const cur = currentYM();
  const [curY, curM] = cur.split('-').map(Number);
  for (let i = 0; i < 12; i++) {
    let m = curM - i, a = curY;
    if (m <= 0) { m += 12; a -= 1; }
    const val = `${a}-${String(m).padStart(2, '0')}`;
    const opt = document.createElement('option');
    opt.value = val;
    opt.textContent = `${MESS[m-1]}. de ${a}`;
    if (val === selectedYM) opt.selected = true;
    el.appendChild(opt);
  }
}

async function fetchGanhos(mesParam) {
  const url = mesParam ? `/api/modelo/ganhos?mes=${mesParam}` : '/api/modelo/ganhos';
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401 || res.status === 403) { window.location.href = '/'; return null; }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadGanhos(ym) {
  document.getElementById('ganhoContent').innerHTML = '<div class="spin-wrap"><div class="spin"></div></div>';
  try {
    const data = await fetchGanhos(ym);
    if (!data) return;

    const rows = data.rows || [];
    const now = new Date();
    const today = todaySP();

    const totalMidias      = rows.filter(r => r.tipo === 'midia').reduce((a, r) => a + +r.valor_modelo, 0);
    const totalAssinaturas = rows.filter(r => r.tipo === 'assinatura').reduce((a, r) => a + +r.valor_modelo, 0);
    const totalMes         = totalMidias + totalAssinaturas;

    const hojeRows = rows.filter(r => r.created_at?.startsWith(today));
    const hojeMidias      = hojeRows.filter(r => r.tipo === 'midia').reduce((a, r) => a + +r.valor_modelo, 0);
    const hojeAssinaturas = hojeRows.filter(r => r.tipo === 'assinatura').reduce((a, r) => a + +r.valor_modelo, 0);

    const isLib  = r => !r.disponivel_em || new Date(r.disponivel_em) <= now;
    const isPend = r => r.disponivel_em && new Date(r.disponivel_em) > now;

    const libHoje  = hojeRows.filter(isLib).reduce((a, r) => a + +r.valor_modelo, 0);
    const pendHoje = hojeRows.filter(isPend).reduce((a, r) => a + +r.valor_modelo, 0);
    const libMes   = rows.filter(isLib).reduce((a, r) => a + +r.valor_modelo, 0);
    const pendMes  = rows.filter(isPend).reduce((a, r) => a + +r.valor_modelo, 0);

    const assinantes = data.assinantes || 0;
    const assHoje    = data.assHoje || 0;

    // Historical: 3 months before ym
    const [y, m] = ym.split('-').map(Number);
    const histData = await Promise.all([1, 2, 3].map(async i => {
      let hm = m - i, hy = y;
      if (hm <= 0) { hm += 12; hy -= 1; }
      const hym = `${hy}-${String(hm).padStart(2, '0')}`;
      const hdata = await fetchGanhos(hym);
      const hrows = hdata?.rows || [];
      return {
        ym: hym,
        midias:      hrows.filter(r => r.tipo === 'midia').reduce((a, r) => a + +r.valor_modelo, 0),
        assinaturas: hrows.filter(r => r.tipo === 'assinatura').reduce((a, r) => a + +r.valor_modelo, 0),
      };
    }));

    renderGanhos({ totalMidias, totalAssinaturas, totalMes, hojeMidias, hojeAssinaturas, assinantes, assHoje, libHoje, pendHoje, libMes, pendMes, histData });
  } catch (e) {
    document.getElementById('ganhoContent').innerHTML = `<p style="color:#dc2626;text-align:center;padding:2rem">${e.message || 'Erro ao carregar dados.'}</p>`;
  }
}

function onMonthChange() { loadGanhos(document.getElementById('monthSel').value); }

function renderGanhos({ totalMidias, totalAssinaturas, totalMes, hojeMidias, hojeAssinaturas, assinantes, assHoje, libHoje, pendHoje, libMes, pendMes, histData }) {
  const histHTML = histData.map(h => {
    const total = h.midias + h.assinaturas;
    const [hy, hm] = h.ym.split('-').map(Number);
    return `
    <div class="hero-card hero-sm" style="margin-bottom:10px">
      <div class="hist-header" onclick="toggleHist(this)">
        <div>
          <p class="hero-sublabel" style="margin:0 0 2px">${MES[hm-1].toUpperCase()} DE ${hy}</p>
          <p class="hero-total" style="margin:0">${fmt(total)}</p>
        </div>
        <i class="bi bi-chevron-down hist-chevron"></i>
      </div>
      <div class="hist-body">
        <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1.5px solid var(--purple-border);margin-top:10px">
          <div>
            <p class="hero-sublabel" style="margin:0 0 2px">Mídias</p>
            <p class="hero-sub" style="margin:0">${fmt(h.midias)}</p>
          </div>
          <div style="text-align:right">
            <p class="hero-sublabel" style="margin:0 0 2px">Assinaturas</p>
            <p class="hero-sub" style="margin:0">${fmt(h.assinaturas)}</p>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('ganhoContent').innerHTML = `
    <div class="hero-card">
      <div class="hero-grid">
        <div>
          <p class="hero-sublabel">Mês Atual · Mídias</p>
          <p class="hero-sub">${fmt(totalMidias)}</p>
        </div>
        <div>
          <p class="hero-sublabel">Mês Atual · Assinaturas</p>
          <p class="hero-sub">${fmt(totalAssinaturas)}</p>
        </div>
      </div>
      <div class="hero-total-row">
        <span class="hero-total-lbl">Total</span>
        <span class="hero-total">${fmt(totalMes)}</span>
      </div>
    </div>

    <p class="sec-label">Hoje</p>
    <div class="g2">
      <div class="stat-card ok">
        <p class="stat-lbl">Mídias</p>
        <p class="stat-val">${fmt(hojeMidias)}</p>
      </div>
      <div class="stat-card ok">
        <p class="stat-lbl">Assinaturas</p>
        <p class="stat-val">${fmt(hojeAssinaturas)}</p>
      </div>
    </div>

    <div class="ass-card">
      <div>
        <p class="stat-lbl" style="margin:0 0 2px">Assinantes Ativos</p>
        <p class="ass-num">${assinantes}</p>
      </div>
      ${assHoje > 0 ? `<span class="badge-verde">+${assHoje} hoje</span>` : ''}
    </div>

    <p class="sec-label">Situação dos Valores</p>
    <div class="g2">
      <div class="stat-card ok">
        <p class="stat-lbl">Liberado Hoje</p>
        <p class="stat-val">${fmt(libHoje)}</p>
      </div>
      <div class="stat-card hold">
        <p class="stat-lbl">Pendentes Hoje</p>
        <p class="stat-val">${fmt(pendHoje)}</p>
      </div>
      <div class="stat-card ok mt8">
        <p class="stat-lbl">Liberado no Mês</p>
        <p class="stat-val">${fmt(libMes)}</p>
      </div>
      <div class="stat-card hold mt8">
        <p class="stat-lbl">Pendentes no Mês</p>
        <p class="stat-val">${fmt(pendMes)}</p>
      </div>
    </div>

    <div class="pendentes-info">
      <strong>O que são valores pendentes?</strong>
      São valores pagos pelo cliente via cartão de crédito. Dependemos da operadora avaliar o pagamento, descartar fraude e liberar o valor — o que pode levar de 3 a 30 dias. Não se preocupe! A própria plataforma atualiza os ganhos pendentes para liberados automaticamente!
    </div>

    ${histData.some(h => h.midias + h.assinaturas > 0) ? `
    <hr class="separador">
    <p class="sec-label">Histórico de Meses</p>
    ${histHTML}` : ''}
  `;
}

function toggleHist(header) {
  const body = header.nextElementSibling;
  const open = body.classList.toggle('open');
  header.classList.toggle('open', open);
}

// Bootstrap
const ym = currentYM();
buildMonthOptions(ym);
carregarHeader().then(() => loadGanhos(ym));
</script>
</body>
</html>
