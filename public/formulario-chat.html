<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Gestão de Chat — Velvet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7B2CFF;
      --purple-light: #9B5CFF;
      --bg: #f5f4f8;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b6b80;
      --border: #e0dff0;
      --radius: 14px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
    }
    header {
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: #fff;
      padding: 28px 24px 20px;
      text-align: center;
      position: relative;
    }
    header img { height: 36px; margin-bottom: 12px; display: block; margin-inline: auto; }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    header p  { font-size: 13px; opacity: .85; max-width: 480px; margin-inline: auto; line-height: 1.5; }

    .lang-switcher {
      position: absolute;
      top: 16px; right: 16px;
      display: flex; gap: 6px;
    }
    .lang-btn {
      background: rgba(255,255,255,.15);
      border: 1.5px solid rgba(255,255,255,.4);
      color: #fff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      letter-spacing: .5px;
    }
    .lang-btn:hover { background: rgba(255,255,255,.28); }
    .lang-btn.active { background: #fff; color: var(--purple); border-color: #fff; }

    .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }

    .nome-modelo-badge {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1.5px solid var(--purple);
      border-radius: 40px; padding: 8px 18px;
      color: var(--purple); font-weight: 600; font-size: 14px;
      width: fit-content; margin: 20px auto 0;
    }

    section.bloco {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px 22px;
      margin-top: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    section.bloco h2 {
      font-size: 15px; font-weight: 700;
      color: var(--purple);
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 10px;
    }

    .campo { margin-bottom: 16px; }
    .campo label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-bottom: 6px;
    }
    .campo input,
    .campo textarea,
    .campo select {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px;
      background: #fafafa; color: var(--text);
      transition: border-color .2s;
      font-family: inherit;
    }
    .campo input:focus,
    .campo textarea:focus,
    .campo select:focus {
      outline: none; border-color: var(--purple);
      background: #fff;
    }
    .campo textarea { min-height: 72px; resize: vertical; }

    .radio-group {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
    }
    .radio-group label {
      display: flex; align-items: center; gap: 6px;
      background: #f2f0fb; border: 1.5px solid var(--border);
      border-radius: 30px; padding: 6px 14px;
      font-size: 13px; font-weight: 500; color: var(--text);
      cursor: pointer; transition: all .15s;
    }
    .radio-group input[type=radio],
    .radio-group input[type=checkbox] { display: none; }
    .radio-group label:has(input:checked) {
      background: var(--purple); border-color: var(--purple); color: #fff;
    }

    .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .duas-colunas { grid-template-columns: 1fr; } }

    .btn-submit {
      display: block; width: 100%; max-width: 400px;
      margin: 28px auto 0; padding: 16px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: #fff; font-size: 16px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(123,44,255,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(123,44,255,.45); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    #mensagemSucesso {
      display: none; text-align: center;
      background: #edfaf1; border: 1.5px solid #34c76e;
      border-radius: var(--radius); padding: 28px 20px;
      margin-top: 24px;
    }
    #mensagemSucesso .check { font-size: 48px; margin-bottom: 10px; }
    #mensagemSucesso h3 { color: #1a7a40; font-size: 18px; margin-bottom: 6px; }
    #mensagemSucesso p  { color: #2d8c50; font-size: 14px; }

    #erroModelo {
      display: none; text-align: center;
      background: #fff3f3; border: 1.5px solid #f44;
      border-radius: var(--radius); padding: 28px 20px; margin-top: 24px;
    }
    #erroModelo h3 { color: #c00; font-size: 16px; }

    .loading-spinner {
      display: flex; justify-content: center; padding: 40px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('pt')" id="btn-pt">PT</button>
    <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
    <button class="lang-btn" onclick="setLang('es')" id="btn-es">ES</button>
  </div>
  <img src="/assets/velvet-white.webp" onerror="this.style.display='none'" alt="Velvet">
  <h1 data-i18n="header_title"></h1>
  <p data-i18n="header_subtitle"></p>
</header>

<div class="container">

  <div id="nomeModeloBadge" style="display:none" class="nome-modelo-badge">
    <span>👤</span><span id="nomeModeloTexto"></span>
  </div>

  <div id="loadingInicial" class="loading-spinner"><div class="spinner"></div></div>

  <div id="erroModelo">
    <h3 data-i18n="erro_modelo"></h3>
  </div>

  <form id="formChat" style="display:none" onsubmit="salvarFormulario(event)">

    <!-- INFORMAÇÕES PESSOAIS -->

            <option value="Divorciada" data-i18n="opt_divorciada"></option>

        <div class="campo"><label data-i18n="label_cidade_estado"></label><input name="cidade_estado" data-i18n-placeholder="ph_cidade_estado"></div>
        <div class="campo"><label data-i18n="label_mora_atualmente"></label><input name="mora_atualmente" data-i18n-placeholder="ph_mora_atualmente"></div>
        <div class="campo"><label data-i18n="label_calcado"></label><input name="numero_calcado" data-i18n-placeholder="ph_calcado"></div>
      </div>
      <div class="campo"><label data-i18n="label_filhos"></label><input name="filhos" data-i18n-placeholder="ph_filhos"></div>
      <div class="campo"><label data-i18n="label_mora_sozinha"></label><input name="mora_sozinha" data-i18n-placeholder="ph_mora_sozinha"></div>
      <div class="campo"><label data-i18n="label_estuda"></label><input name="estuda" data-i18n-placeholder="ph_estuda"></div>
      <div class="campo"><label data-i18n="label_trabalha_alem"></label><input name="trabalha_alem" data-i18n-placeholder="ph_trabalha_alem"></div>

    <!-- PERSONALIDADE -->

          <label><input type="radio" name="estilo_personalidade" value="Provocadora"> <span data-i18n="opt_provocadora"></span></label>
          <label><input type="radio" name="estilo_personalidade" value="Carinhosa"> <span data-i18n="opt_carinhosa"></span></label>
          <label><input type="radio" name="estilo_personalidade" value="Todas"> <span data-i18n="opt_todas"></span></label>

      <div class="duas-colunas">

        <div class="campo"><label data-i18n="label_praia_piscina"></label>
          <div class="radio-group">
            <label><input type="radio" name="praia_piscina" value="Praia"> <span data-i18n="opt_praia"></span></label>
            <label><input type="radio" name="praia_piscina" value="Piscina"> <span data-i18n="opt_piscina"></span></label>
            <label><input type="radio" name="praia_piscina" value="As duas"> <span data-i18n="opt_as_duas"></span></label>

            <label><input type="radio" name="campo_cidade" value="Campo"> <span data-i18n="opt_campo"></span></label>
            <label><input type="radio" name="campo_cidade" value="Cidade"> <span data-i18n="opt_cidade"></span></label>
            <label><input type="radio" name="campo_cidade" value="Os dois"> <span data-i18n="opt_os_dois"></span></label>

        <div class="campo"><label data-i18n="label_frio_calor"></label>
          <div class="radio-group">
            <label><input type="radio" name="frio_calor" value="Frio"> <span data-i18n="opt_frio"></span></label>
            <label><input type="radio" name="frio_calor" value="Calor"> <span data-i18n="opt_calor"></span></label>
            <label><input type="radio" name="frio_calor" value="Tanto faz"> <span data-i18n="opt_tanto_faz"></span></label>
          </div>
        </div>
        <div class="campo"><label data-i18n="label_manha_noite"></label>
          <div class="radio-group">
            <label><input type="radio" name="manha_noite" value="Manhã"> <span data-i18n="opt_manha"></span></label>
            <label><input type="radio" name="manha_noite" value="Noite"> <span data-i18n="opt_noite"></span></label>
            <label><input type="radio" name="manha_noite" value="As duas"> <span data-i18n="opt_as_duas"></span></label>

      </div>
      <div class="campo"><label data-i18n="label_maior_sonho"></label><textarea name="maior_sonho" data-i18n-placeholder="ph_maior_sonho"></textarea></div>
    </section>

    <!-- GOSTOS PESSOAIS -->
    <section class="bloco">
      <h2>🎵 <span data-i18n="sec_gostos"></span></h2>
      <div class="duas-colunas">
        <div class="campo"><label data-i18n="label_hobbies"></label><input name="hobbies" data-i18n-placeholder="ph_hobbies"></div>
        <div class="campo"><label data-i18n="label_esportes"></label><input name="esportes_favoritos" data-i18n-placeholder="ph_esportes"></div>
        <div class="campo"><label data-i18n="label_musica"></label><input name="musica_favorita" data-i18n-placeholder="ph_musica"></div>
        <div class="campo"><label data-i18n="label_artistas"></label><input name="artistas_favoritos" data-i18n-placeholder="ph_artistas"></div>
        <div class="campo"><label data-i18n="label_filmes"></label><input name="filmes_favoritos" data-i18n-placeholder="ph_filmes"></div>
        <div class="campo"><label data-i18n="label_series"></label><input name="series_favoritas" data-i18n-placeholder="ph_series"></div>
        <div class="campo"><label data-i18n="label_livros"></label><input name="livros_favoritos" data-i18n-placeholder="ph_livros"></div>
        <div class="campo"><label data-i18n="label_jogos"></label><input name="jogos_favoritos" data-i18n-placeholder="ph_jogos"></div>
        <div class="campo"><label data-i18n="label_cor"></label><input name="cor_favorita" data-i18n-placeholder="ph_cor"></div>
        <div class="campo"><label data-i18n="label_estacao"></label>
          <select name="estacao_favorita">
            <option value="" data-i18n="opt_selecione"></option>
            <option value="Verão" data-i18n="opt_verao"></option>

    <!-- COMIDA -->

            <label><input type="radio" name="cafe_cha" value="Os dois"> <span data-i18n="opt_os_dois"></span></label>

    <!-- VIAGENS -->

      <h2>✈️ <span data-i18n="sec_viagens"></span></h2>

        <div class="campo"><label data-i18n="label_futebol"></label>
          <div class="radio-group">
            <label><input type="radio" name="assiste_futebol" value="Sim"> <span data-i18n="opt_sim"></span></label>

            <label><input type="radio" name="gosta_videogames" value="Às vezes"> <span data-i18n="opt_as_vezes"></span></label>

            <label><input type="radio" name="assiste_anime" value="Não"> <span data-i18n="opt_nao"></span></label>
          </div>
        </div>
        <div class="campo"><label data-i18n="label_streamers"></label>
          <div class="radio-group">

let currentLang = 'pt';

function setLang(lang) {
  currentLang = lang;
  const t = i18n[lang];

  // Buttons
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');

  // html lang
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;

  // Text nodes
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // Placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.placeholder = t[key];
  });

  // Select options
  document.querySelectorAll('select option[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // Submit button (also has data-i18n already handled above, but handle disabled state)
  const btn = document.getElementById('btnSubmit');
  if (btn && !btn.disabled) btn.textContent = t['btn_enviar'];

  // Store for alert messages
  window._i18nAlert = t['alert_erro'];
  window._i18nSaving = t['btn_saving'];
  window._i18nBtn = t['btn_enviar'];
}

// Init
window._i18nAlert = i18n.pt.alert_erro;
window._i18nSaving = i18n.pt.btn_saving;
window._i18nBtn = i18n.pt.btn_enviar;
setLang('pt');

// ── App logic ──────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const modeloId = Number(params.get("modelo"));

async function init() {
  if (!modeloId) {
    document.getElementById("loadingInicial").style.display = "none";
    document.getElementById("erroModelo").style.display = "block";
    return;
  }

  try {
    const res = await fetch(`/api/chat-form/${modeloId}`);
    if (!res.ok) throw new Error("não encontrado");
    const data = await res.json();

    document.getElementById("nomeModeloTexto").textContent = data.nome_modelo;
    document.getElementById("nomeModeloBadge").style.display = "flex";
    document.getElementById("loadingInicial").style.display = "none";
    document.getElementById("formChat").style.display = "block";

    if (data.respostas) preencherFormulario(data.respostas);

  } catch (e) {
    document.getElementById("loadingInicial").style.display = "none";
    document.getElementById("erroModelo").style.display = "block";
  }
}

function preencherFormulario(r) {
  const form = document.getElementById("formChat");

  for (const [key, val] of Object.entries(r)) {
    if (Array.isArray(val)) {
      form.querySelectorAll(`input[name="${key}"]`).forEach(el => {
        el.checked = val.includes(el.value);
      });
    } else {
      const el = form.elements[key];
      if (!el) continue;
      if (el.type === "radio") {
        form.querySelectorAll(`input[name="${key}"]`).forEach(r => {
          if (r.value === val) r.checked = true;
        });
      } else {
        el.value = val || "";
      }
    }
  }
}

    "melhor_viagem","proximo_destino","pais_conhecer","lugar_nao_moraria",
    "nome_animais","animal_favorito","alergia_animal","atividade_fisica","time_favorito",
    "cor_cabelo","tatuagens","piercings","altura","peso",
    "preferencia_tratamento","apelidos_custom","conversa_nao_gosta",
    "assuntos_proibidos","mentiras_manter","palavras_nao_gosta","promessas_nao_fazer",
    "conteudo_favorito","como_escrever","girias",
    "perguntas_frequentes","curiosidades","informacao_importante"
  ];

  simples.forEach(name => {
    const el = form.elements[name];
    if (el) respostas[name] = el.value.trim();
  });

  const radios = ["timida_extrovertida","estilo_personalidade","ciumenta","caseira_sair",
    "praia_piscina","campo_cidade","frio_calor","manha_noite","doce_salgado","cafe_cha","cozinha",
    "assiste_futebol","gosta_videogames","assiste_anime","assiste_streamers",
    "usa_extensoes","faria_personalizados","chamar_pelo_nome","tem_animais"
  ];

  radios.forEach(name => {
    const checked = form.querySelector(`input[name="${name}"]:checked`);
    if (checked) respostas[name] = checked.value;
  });

  const multiCheck = ["redes_sociais","apelidos","nivel_intimidade"];
  multiCheck.forEach(name => {
    respostas[name] = Array.from(
      form.querySelectorAll(`input[name="${name}"]:checked`)
    ).map(el => el.value);
  });

  try {
    const res = await fetch("/api/chat-form/salvar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ modelo_id: modeloId, respostas })
    });
    if (!res.ok) throw new Error("Erro ao guardar");

    document.getElementById("formChat").style.display = "none";
    document.getElementById("mensagemSucesso").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    btn.disabled = false;
    btn.textContent = window._i18nBtn;
    alert(window._i18nAlert);
  }
}

init();
</script>
</body>
</html>
