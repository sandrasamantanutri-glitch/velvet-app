<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
   <title>Subscrições e Transações</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/transacoes.css">
  <link rel="stylesheet" href="/area.css">
</head>

<body>
 <div id="header-container"></div>

 <section class="area-card">

  <button type="button" class="btn-voltar" onclick="history.back()"> <img src="/assets/voltar.png" alt="Voltar"> </button>
  <div class="tabs">
        <button class="tab-btn ativa" data-tab="subscricoes">
      Subscrições
        </button>
    <button class="tab-btn" data-tab="transacoes">
      Transações
    </button>
  </div>

  <div id="tab-subscricoes" class="tab-content ativa">

    <h3>Subscrições VIP</h3>

    <p class="transacoes-descricao">
      Aqui você pode gerir suas assinaturas VIP ativas.
    </p>

    <div id="listaSubscricoes" class="lista-transacoes">
      Carregando subscrições...
    </div>
  </div>

  <div id="tab-transacoes" class="tab-content">
 <h3>Transações</h3>
 <p class="transacoes-descricao">
  Aqui você pode conferir todos os pagamentos que já fez na plataforma.
</p>
  <div class="filtros">
  <select id="filtroTipo">
    <option value="">Todos</option>
    <option value="conteudo">Conteúdos</option>
    <option value="assinatura">Assinaturas VIP</option>
  </select>
</div>

  <div id="listaTransacoes" class="lista-transacoes">
    Carregando transações...
  </div>
  <div id="paginacao" class="paginacao"></div>
  </div>
</section>

    <script>
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("token");

  if (!token) {
    alert("Para ter acesso a essa página deve fazer seu login ou seu cadastro.");

    window.location.href = "/index.html";
    return;
  }

});
</script>

<script src="/transacoes.js"></script>
<script src="/header.js"></script>

</body>
</html>
