<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Velvet em atualização</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #7B2CFF, #9E6BFF);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 40px;
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      opacity: 0.9;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">VELVET</div>
    <h1>Estamos em atualização 💜</h1>
    <p>
      A plataforma está passando por melhorias.<br>
      Em breve estaremos de volta.
    </p>
  </div>
</body>
</html>
