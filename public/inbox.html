      color:#fff;text-decoration:none;
      padding:10px 16px;font-size:13px;font-weight:600;gap:10px;
      border-radius:14px;margin:8px 0 4px;
    ">

        Google Play
      </span>
    </a>

 <h3 data-i18n="inbox.title">Conversas</h3>

  <div class="content">
    <main id="inbox" class="inbox">
      <!-- ITEM DO CHAT -->
      <!--
      Estados esperados (JS controla classes/labels):

      1) Cliente recebeu mensagem:
         <span class="status status-sent">✓</span>

      2) Cliente leu e não respondeu:
         <span class="status status-read">✓✓</span>

      3) Modelo entrou no chat, leu e não respondeu:
         <span class="status status-reply">Necessita de resposta</span>

      4) Modelo ainda não visualizou:
         <span class="status status-unseen">Não visto</span>
      -->

      <!-- EXEMPLO ESTRUTURAL -->
      <!--
      <div class="chat-item">
        <div class="avatar">
          <img src="avatar.jpg" />
        </div>

        <div class="chat-body">
          <div class="chat-top">
            <span class="chat-name">Cliente</span>
            <span class="chat-time">14:32</span>
          </div>

          <div class="chat-bottom">
            <span class="chat-last">Última mensagem aqui…</span>

            <div class="chat-status">
              <span class="status status-read">✓✓</span>
            </div>
          </div>
        </div>
      </div>
      -->
    </main>
    
  </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/inbox.js" defer></script>

</body>
