<h1 id="tituloModelo">Modelo:</h1>

<div class="dashboard-grid">

      <span>Agência:</span>

    </div>

    </div>

    <div class="linha">
      <span>Agência:</span>
      <strong id="agenciaMes"></strong>
    </div>
  </div>

  <!-- ANO -->
  <div class="periodo-card ano">
    <h2>ANO</h2>

    <div class="linha">
      <span>Modelo:</span>
      <strong id="modeloAno"></strong>
    </div>

    <div class="linha">
      <span>Agência:</span>

    </div>

  </div>

</div>
<br><br>

<div class="card">
  <h3>Percentual</h3>

  <label>Percentual Modelo</label>
  <input type="range" id="rangeModelo" min="40" max="80" value="60" step="1">
  <div class="valor" id="valorModelo">60%</div>

  <br>

  <label>Percentual Agência</label>
  <input type="range" id="rangeAgencia" min="10" max="40" value="20" step="1">
  <div class="valor" id="valorAgencia">20%</div>

  <br>

<script>

const token = localStorage.getItem("token_agencia");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function carregar(){

  const res = await fetch("/api/agencia/modelo/"+id,{
    headers:{ Authorization:"Bearer "+token }
  });

  if(!res.ok){
    console.error("Erro ao carregar modelo");
    return;
  }

  const data = await res.json();
  document.getElementById("tituloModelo").innerText =
  "Modelo: " + (data.nome || "Sem nome") + " | ID: " + id;

  // HOJE
  document.getElementById("modeloDia").innerText =
    "R$ "+Number(data.modelo_dia||0).toFixed(2);

  document.getElementById("agenciaDia").innerText =
    "R$ "+Number(data.agencia_dia||0).toFixed(2);

  // MÊS
  document.getElementById("modeloMes").innerText =
    "R$ "+Number(data.modelo_mes||0).toFixed(2);

  document.getElementById("agenciaMes").innerText =
    "R$ "+Number(data.agencia_mes||0).toFixed(2);

  // ANO
  document.getElementById("modeloAno").innerText =
    "R$ "+Number(data.modelo_ano||0).toFixed(2);

  document.getElementById("agenciaAno").innerText =
    "R$ "+Number(data.agencia_ano||0).toFixed(2);
}
carregar();

async function carregarModelos(){
  const res = await fetch("/api/agencia/modelos",{
    headers:{ Authorization:"Bearer "+token }
  });

  const modelos = await res.json();

  const select = document.getElementById("modeloSelect");

  modelos.forEach(m=>{
    select.innerHTML += `<option value="${m.id}">${m.nome}</option>`;
  });
}

function irModelo(){
  const id = document.getElementById("modeloSelect").value;
  if(id) window.location.href="modelo.html?id="+id;
}
