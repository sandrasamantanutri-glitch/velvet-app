<section class="area-card">
<div class="perfil-capa"> <img id="perfil-capa" src="/assets/capa.png" alt="Capa"/></div>
<div class="perfil-avatar"> <img id="perfil-avatar" src="/assets/avatar.png" alt="Avatar"/></div>
<div class="perfil-nome" id="perfil-nome"> Sandra</div>
<body class="role-modelo">
</section>


<section class="area-section">
 <h3>Informações de Usuário</h3>
 <form id="formDadosModelo" class="form-area">

  <div class="form-grid">
    <div class="form-group">
      <label>Seu nome de Usuário (seu @)*</label>
      <input type="text" name="nome_exibicao" placeholder="Como quer ser chamado(a) na plataforma" required>
    </div>

    <div class="form-group">
      <label>Instagram</label>
      <input type="text" name="instagram" placeholder="@seuinstagram">
    </div>

    <div class="form-group">
      <label>TikTok</label>
      <input type="text" name="tiktok" placeholder="@seutiktok">
    </div>

    <div class="form-group">
      <label>Localização*</label>
      <input type="text" name="localizacao" placeholder="Estado - Cidade">
    </div>

    <div class="form-group full">
      <label>Sua Bio*</label>
      <textarea name="bio" rows="4" placeholder="Escreva sua biografia aqui!"></textarea>
      <label>*Informações obrigatórias</label>
    </div>
    </div>
    <button type="submit" class="btn-salvar">Salvar</button>
   </form>
</section>


<hr class="separator">

<section class="area-section">
 <h3>Informações Pessoais</h3>

 <form id="formDadosPessoais" class="form-area">

  <span class="form-info">
    Mantenha suas informações em dia para uma melhor experiência na plataforma.
  </span>
  <div class="form-grid">

    <div class="form-group full">
      <label>Nome completo*</label>
      <input type="text" name="nome_completo"  placeholder="Nome e Sobrenome" required>
    </div>

    <div class="form-group">
      <label>Data de nascimento*</label>
      <input type="date" name="data_nascimento" required>
    </div>

    <div class="form-group">
      <label>Telefone com DDD*</label>
      <input type="text" name="telefone" placeholder="(11) 99999-9999" required>
    </div>

    <div class="form-group full">
      <label>Endereço</label>
      <textarea name="endereco" rows="2"  placeholder="Rua, numero, bairro" required></textarea>
    </div>

    <div class="form-group">
      <label>Estado</label>
      <input type="text" name="estado"required>
    </div>

    <div class="form-group">
      <label>Cidade</label>
      <input type="text" name="cidade" required>
    </div>

    <div class="form-group full">
      <label>País*</label>
      <input type="text" name="pais" required>
    <label>*Informações obrigatórias</label>
    </div>
  
  </div>
  <button type="submit" class="btn-salvar">Salvar</button>

</form>

<hr class="separator">

<section class="area-section">Excluir minha Conta</section>
  <div class="danger-zone"><button class="btn-danger" onclick="abrirConfirmacaoExclusao()">
    Excluir conta permanentemente</button>
  </div>
</section>
