<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>

<link rel="stylesheet" href="/chatcliente.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/pag.css">
</head>

<body class="role-cliente">

  <!-- HEADER GLOBAL -->
  <div id="header-container"></div>

  <!-- HEADER DO CHAT -->
  <header class="chat-topo">
    <button type="button" class="btn-voltar" onclick="history.back()">
      <img src="/assets/voltar.png" alt="Voltar">
    </button>

    <div class="chat-cliente-info">
      <img id="chatClienteAvatar"
           class="chat-avatar"
           src="/assets/avatar.png"
           alt="Avatar cliente" />

      <div class="chat-cliente-texto">
        <div id="chatClienteNome" class="chat-nome">Cliente</div>
        <div id="chatClienteStatus" class="chat-status">carregando…</div>
      </div>
    </div>
  </header>

  <!-- ÁREA DO CHAT -->
  <div class="chat-area painel">

    <div id="chatBox"></div>
   <input
    id="msgInput"
    type="text"
    placeholder="Digite uma mensagem..."
    autocomplete="off"/>

   <button
    class="btn-enviar1"
    onclick="enviarMensagem()"
    aria-label="Enviar mensagem"
   >
    <img src="/assets/enviar.png" alt="Enviar" />
   </button>
  </div>
<!-- ================= POPUPS ================= -->

<div id="popupPagamentoVelvet" class="velvet-modal hidden">

  <div class="velvet-backdrop" onclick="fecharPopupPagamento()"></div>

  <div class="velvet-box">

    <button class="velvet-close"
      onclick="fecharPopupPagamento()">×</button>

    <h3 class="velvet-title">Desbloquear conteúdo</h3>

    <!-- 🔥 RESUMO MÍDIA -->
    <div class="midia-detalhes">
      <p>Conteúdo: R$ <span id="midiaValorBase">0,00</span></p>
      <p>Taxa: R$ <span id="midiaTaxa">0,00</span></p>
      <p><strong>Total: R$ <span id="midiaTotal">0,00</span></strong></p>
    </div>

    <!-- 💳 CARTÃO -->
    <div id="conteudoCartao">

      <div id="cartaoLoading">
        Carregando pagamento...
      </div>

      <form id="formCartao" class="hidden">
        <div id="card-element"></div>

        <button class="btn-principal" type="submit">
          Confirmar desbloqueio
        </button>
      </form>

      <div id="cartaoSucesso" class="hidden">
        Pagamento confirmado 💜
      </div>

    </div>

  </div>
</div>

<!-- MODAL CONTEÚDO LIBERADO -->
<div id="modalConteudo" class="hidden">
  <button class="modal-close" onclick="fecharConteudo()">×</button>
  <div id="modalMidia"></div>
  </div>


<script src="/socket.io/socket.io.js"></script>
<script src="/header.js"></script>
<script src="https://js.stripe.com/v3/"></script>

 <script src="/pag.js" defer></script>
<script src="js/chatc.js" defer></script>

</body>
</html>
