<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Chat</title>
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/chatcliente.css">
  <link rel="stylesheet" href="/pag.css">
</head>

<body>
 <div id="header-container"></div>
<header class="chat-topo">
  <button type="button" class="btn-voltar" onclick="history.back()">
    <img src="/assets/voltar.png" alt="Voltar">
  </button>

  <div class="chat-cliente-info">
    <img id="chatModeloAvatar"class="chat-avatar"src="/assets/avatar.png"alt="Avatar modelo"/>
    <div class="chat-cliente-texto">
      <div id="chatModeloNome" class="chat-nome">Modelo</div>
      <div id="chatModeloStatus" class="chat-status">carregando…</div>
    </div>
  </div>
</header>


<div class="chat-container">
<main id="chatBox" class="chat-box"></main>

<footer class="chat-input">
  <button
    id="btnEnviarConteudo1"
    class="btn-midia"  onclick="avisoMidiaEmBreve()"
  aria-label="Enviar mídia">
    <img src="/assets/midia.png" alt="Mídia" />
  </button>

  <input
    id="msgInput"
    type="text"
    placeholder="Digite uma mensagem..."
    autocomplete="off"/>

  <button
    class="btn-enviar1"
    onclick="enviarMensagem()"
    aria-label="Enviar mensagem"
  >
    <img src="/assets/enviar.png" alt="Enviar" />
  </button>
</footer>
</div>

<div id="popupConteudos" class="hidden">
  
  <div class="popup-backdrop" onclick="fecharPopupConteudos()"></div>

  <div class="popup-box">
    <h3>Enviar conteúdo</h3>

    <div class="preview-scroll">
      <div id="previewConteudos" class="preview-grid"></div>
    </div>

    <div class="popup-preco">
      <label>Preço (R$)</label>
      <input type="number" id="precoConteudo" value="0" min="0" />
    </div>

    <div class="popup-actions">
      <button class="btn-cancelar" onclick="fecharPopupConteudos()">Cancelar</button>
      <button class="btn-enviar" onclick="confirmarEnvioConteudo()">Enviar</button>
    </div>
  </div>

</div>

<div id="menuMensagem" class="hidden">
  <div class="popup-backdrop" onclick="fecharMenuMensagem()"></div>

  <div class="popup-box">
    <h3>Mensagem</h3>

    <textarea id="editarTexto" placeholder="Editar mensagem..."></textarea>

    <div class="popup-actions">
      <button onclick="salvarEdicao()">Salvar</button>
      <button onclick="excluirMensagem()" style="color:red">Excluir</button>
      <button onclick="fecharMenuMensagem()">Cancelar</button>
    </div>
  </div>
</div>

<div id="popupMidiaEmBreve" class="hidden">
  <div class="popup-backdrop" onclick="fecharPopupMidia()"></div>

  <div class="popup-box">
    <h3>Em breve ✨</h3>
    <p>Em breve será possível enviar mídias pelo chat.</p>

    <button class="btn-fechar" onclick="fecharPopupMidia()">
      Entendi
    </button>
  </div>
</div>

<!-- ===============================
     POPUP PAGAMENTO VELVET
================================ -->
<div id="popupPagamentoVelvet" class="velvet-modal hidden">

  <div class="velvet-backdrop" onclick="fecharPopupPagamento()"></div>

  <div class="velvet-box">

    <button class="velvet-close" onclick="fecharPopupPagamento()">×</button>

    <h2 class="velvet-title">Pagamento</h2>

    <!-- ===== RESUMO MÍDIA ===== -->
    <div class="midia-detalhes hidden">
      <p><strong>Valor:</strong> R$ <span id="midiaValorBase">0,00</span></p>
      <p><strong>Taxa:</strong> R$ <span id="midiaTaxa">0,00</span></p>
      <p><strong>Total:</strong> R$ <span id="midiaTotal">0,00</span></p>
    </div>

    <!-- ===== CARTÃO ===== -->
    <div id="conteudoCartao" class="hidden">
      <div id="card-element"></div>

      <div id="cartaoLoading" class="cartao-status hidden">
        Processando...
      </div>

      <form id="formCartao" class="hidden">
        <button type="submit" class="btn-principal">
          Confirmar pagamento
        </button>
      </form>

      <div id="cartaoSucesso" class="cartao-status hidden">
        Pagamento confirmado 💜
      </div>
    </div>

  </div>
</div>

<div id="modalConteudo" class="hidden">
  <div class="modal-backdrop" onclick="fecharConteudo()"></div>
  <div class="modal-box">
    <button class="modal-close" onclick="fecharConteudo()">×</button>
    <div id="modalMidia"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="/header.js"></script>
<script src="/pag.js" defer></script>
<script src="/js/chatc.js"defer></script>
</body>
</html>
