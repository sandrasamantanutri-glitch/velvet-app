function render(lang) {
  const d = T[lang];
  document.documentElement.lang = d.htmlLang;
  document.getElementById('pageTitle').textContent = d.pageTitle;
  document.getElementById('lastUpdatedLabel').textContent = d.lastUpdatedLabel;
  document.getElementById('lastUpdatedDate').textContent = d.lastUpdatedDate;
  document.getElementById('introText').textContent = d.introText;
  document.getElementById('legalNote').textContent = d.legalNote;
  document.getElementById('tocNav').setAttribute('aria-label', d.tocAriaLabel);
  document.getElementById('tocTitle').textContent = d.tocTitle;
  document.getElementById('footerTerms').textContent = d.footerTerms;
  document.getElementById('footerPrivacy').textContent = d.footerPrivacy;
  document.getElementById('footerCopy').textContent = d.footerCopy;

  const tocList = document.getElementById('tocList');
  tocList.innerHTML = d.sections.map(s =>
    `<li><a href="#${s.id}">${s.title}</a></li>`
  ).join('');

  const container = document.getElementById('sectionsContainer');
  container.innerHTML = d.sections.map((s, i) => `
    ${i > 0 ? '<hr class="divider">' : ''}
    <section id="${s.id}">
      <h2 class="section-title">${s.title}</h2>
      ${s.content}
    </section>
  `).join('');

  document.querySelectorAll('.lang-bar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  try { localStorage.setItem('velvet_terms_lang', lang); } catch(e) {}
}

document.querySelectorAll('.lang-bar button').forEach(btn => {
  btn.addEventListener('click', () => render(btn.dataset.lang));
});

let initLang = 'pt';
try { initLang = localStorage.getItem('velvet_terms_lang') || 'pt'; } catch(e) {}
if (!T[initLang]) initLang = 'pt';
render(initLang);
</script>
